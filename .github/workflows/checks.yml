name: Public guide checks
on:
  push:
    branches: [guide-foundation]
  pull_request:
    branches: [guide-foundation]
permissions:
  contents: read
concurrency:
  group: guide-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-check-results
          path: test-results/
          retention-days: 7
