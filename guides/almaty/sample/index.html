<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Первый день в Алматы | Kazakhstan Guide</title><style>:root{font:17px system-ui,-apple-system,sans-serif;color:#173f4c;background:#fafcfb;line-height:1.7}*{box-sizing:border-box}body{margin:0}.wrap{width:min(100% - 36px,850px);margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 0}a{color:#007d94;text-underline-offset:4px}.brand{font-size:14px;font-weight:800;text-decoration:none;color:#173f4c;letter-spacing:.06em}button,.button{font:inherit;display:inline-block;border:1px solid #afcdd1;border-radius:8px;background:white;color:#007d94;padding:11px 16px;cursor:pointer;min-height:44px;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #af8414;outline-offset:3px}h1{font-size:clamp(32px,6vw,48px);line-height:1.15;margin:20px 0}h2{font-size:23px;line-height:1.3}h3{font-size:19px}.lead{font-size:20px}.eyebrow,.muted{font-size:14px;color:#5e7680}.card{background:white;border:1px solid #d6e5e8;border-radius:12px;padding:24px;margin:22px 0}.note{background:#edf7f8;border-left:3px solid #dfb63e;padding:20px;border-radius:0 9px 9px 0}label{display:block;padding:12px 0}input{margin-right:10px;width:18px;height:18px}.actions{display:flex;flex-wrap:wrap;gap:12px}details{border-top:1px solid #d6e5e8;padding-top:15px;margin-top:16px}summary{cursor:pointer;font-weight:650}.primary{background:#007d94;color:white}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;background:white;padding:12px}footer{margin-top:45px;border-top:1px solid #d6e5e8;padding:25px 0}.day-path{font-weight:650}p{overflow-wrap:anywhere}@media print{.no-print,header,.skip{display:none!important}body{background:white;font-size:11pt}.wrap{width:100%}.card{break-inside:avoid;padding:14px}details>*{display:block!important}a{color:inherit}}</style></head><body><a class="skip" href="#main">К содержимому / 본문으로</a><div class="wrap" id="sample"></div><script type="application/json" id="sample-data">{"stops":[{"placeId":"almaty-panfilov-park","period":{"ru":"Начало прогулки","ko":"산책의 시작"},"time":{"ru":"Около часа","ko":"약 1시간"},"note":{"ru":"Пройдите по аллеям парка, остановитесь у мемориала и рассмотрите Вознесенский собор снаружи. Внутренний осмотр оставьте по желанию, не мешая службе. Музей и экскурсия в основной план не входят.","ko":"공원 길을 걸으며 기념 공간을 둘러보고 승천 대성당의 외관을 감상합니다. 내부는 예배에 방해되지 않는 범위에서 선택적으로 방문하세요. 박물관 관람이나 해설 투어는 기본 일정에 포함하지 않습니다."},"next":{"ru":"От собора выйдите на улицу Гоголя и направляйтесь к проспекту Достык. По Достыку идите на север до Жибек Жолы, затем поверните направо к Зелёному базару. По карте это около 650 м; на спокойный переход оставьте от 10 до 15 минут.","ko":"대성당에서 고골 거리로 나와 도스틱 대로 쪽으로 걷습니다. 도스틱을 따라 북쪽의 지벡 졸르 거리까지 간 뒤 오른쪽으로 돌면 그린 바자르에 닿습니다. 지도상 약 650m로, 여유 있게 걸으면 10~15분 정도입니다."},"nextMapUrl":"https://www.google.com/maps/dir/?api=1&origin=%D0%92%D0%BE%D0%B7%D0%BD%D0%B5%D1%81%D0%B5%D0%BD%D1%81%D0%BA%D0%B8%D0%B9%20%D0%BA%D0%B0%D1%84%D0%B5%D0%B4%D1%80%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D1%81%D0%BE%D0%B1%D0%BE%D1%80%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%93%D0%BE%D0%B3%D0%BE%D0%BB%D1%8F%2040%D0%92%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B&destination=%D0%97%D0%B5%D0%BB%D1%91%D0%BD%D1%8B%D0%B9%20%D0%B1%D0%B0%D0%B7%D0%B0%D1%80%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%96%D0%B8%D0%B1%D0%B5%D0%BA%20%D0%96%D0%BE%D0%BB%D1%8B%2053%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B&travelmode=walking"},{"placeId":"almaty-green-bazaar","period":{"ru":"Следующая остановка","ko":"시장 둘러보기"},"time":{"ru":"Около часа","ko":"약 1시간"},"note":{"ru":"Пройдите вдоль рядов с фруктами, орехами и сладостями. Покупать что-то не обязательно. Если выбираете сухофрукты, учитывайте вес: цена может быть указана за килограмм. По понедельникам базар пропускаем.","ko":"과일과 견과류, 과자가 놓인 가판대를 천천히 둘러봅니다. 물건을 사지 않아도 좋습니다. 말린 과일을 고른다면 표시 가격이 1kg 기준일 수 있다는 점을 기억하세요. 월요일에는 시장을 제외합니다."},"next":{"ru":"Выйдите к Жибек Жолы и идите на запад. Примерно через 500 м, у улицы Кунаева, начинается пешеходная часть Арбата. До неё около 10 минут спокойным шагом. Дальше прогулка продолжается по той же улице.","ko":"지벡 졸르 거리로 나와 서쪽으로 걸으세요. 약 500m를 지나 쿠나예프 거리에 이르면 아르바트 보행자 구간이 시작됩니다. 여유 있게 약 10분을 잡고, 도착한 뒤에도 같은 거리를 따라 산책을 이어 갑니다."},"nextMapUrl":"https://www.google.com/maps/dir/?api=1&origin=%D0%97%D0%B5%D0%BB%D1%91%D0%BD%D1%8B%D0%B9%20%D0%B1%D0%B0%D0%B7%D0%B0%D1%80%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%96%D0%B8%D0%B1%D0%B5%D0%BA%20%D0%96%D0%BE%D0%BB%D1%8B%2053%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B&destination=Zhibek%20Zholy%20St%20%26%20Kunaev%20St%2C%20Almaty&travelmode=walking"},{"placeId":"almaty-arbat","period":{"ru":"Прогулка и обед","ko":"아르바트와 식사"},"time":{"ru":"Около полутора или двух часов с едой","ko":"식사 포함 약 1시간 30분~2시간"},"note":{"ru":"От Кунаева продолжайте по Жибек Жолы на запад, через пересечение с Панфилова к проспекту Абылай хана. По пути можно рассматривать витрины и работы художников, если они выставлены. Оставьте время на обед в этой части центра. Уличная музыка бывает не каждый день.","ko":"쿠나예프 거리에서 지벡 졸르를 따라 서쪽으로 계속 걷습니다. 판필로프 거리와 만나는 곳을 지나 아블라이 한 대로 쪽으로 가며 상점과 전시된 거리 작품을 둘러보세요. 이 일대에서 식사할 여유도 남겨 둡니다. 거리 음악은 매일 열리는 프로그램은 아닙니다."},"next":{"ru":"У проспекта Абылай хана прогулка заканчивается. После еды возвращайтесь в своё жильё. Проходить тот же Арбат обратно ради следующей остановки не нужно.","ko":"아블라이 한 대로에 이르면 산책이 끝납니다. 식사 후에는 숙소로 돌아가세요. 다음 장소를 위해 아르바트를 다시 되짚어 걸을 필요는 없습니다."}}],"conditions":[{"title":{"ru":"Если это понедельник","ko":"월요일이라면"},"body":{"ru":"Базар пропускаем. Из парка выйдите на запад к улице Кунаева, затем идите на север до Жибек Жолы. Поверните налево и продолжайте по Арбату к Абылай хана. Так прогулка идёт прямо к пешеходной улице, без обхода через закрытый рынок.","ko":"월요일에는 시장을 제외합니다. 공원 서쪽의 쿠나예프 거리로 나와 북쪽으로 걷다가 지벡 졸르에서 왼쪽으로 도세요. 아르바트를 따라 아블라이 한 대로까지 이어 가면 됩니다. 닫힌 시장을 거치지 않고 보행자 거리로 바로 가는 동선입니다."},"mapUrl":"https://www.google.com/maps/dir/?api=1&origin=%D0%92%D0%BE%D0%B7%D0%BD%D0%B5%D1%81%D0%B5%D0%BD%D1%81%D0%BA%D0%B8%D0%B9%20%D0%BA%D0%B0%D1%84%D0%B5%D0%B4%D1%80%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D1%81%D0%BE%D0%B1%D0%BE%D1%80%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%93%D0%BE%D0%B3%D0%BE%D0%BB%D1%8F%2040%D0%92%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B&destination=Zhibek%20Zholy%20St%20%26%20Kunaev%20St%2C%20Almaty&travelmode=walking"},{"title":{"ru":"Если устали или погода мешает","ko":"피곤하거나 날씨가 좋지 않다면"},"body":{"ru":"Остановитесь после парка или базара и вернитесь в жильё. Зимой и после осадков дорожки могут быть скользкими. В жаркий день делайте паузы в помещении. Прогулка почти целиком проходит на улице.","ko":"공원이나 시장을 둘러본 뒤 숙소로 돌아가도 좋습니다. 겨울이나 비가 온 뒤에는 길이 미끄러울 수 있습니다. 더운 날에는 실내에서 쉬어 가세요. 이 일정은 대부분 야외 산책입니다."}}],"startMapUrl":"https://www.google.com/maps/search/?api=1&query=%D0%92%D0%BE%D0%B7%D0%BD%D0%B5%D1%81%D0%B5%D0%BD%D1%81%D0%BA%D0%B8%D0%B9%20%D0%BA%D0%B0%D1%84%D0%B5%D0%B4%D1%80%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D1%81%D0%BE%D0%B1%D0%BE%D1%80%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%93%D0%BE%D0%B3%D0%BE%D0%BB%D1%8F%2040%D0%92%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B","mondayMapUrl":"https://www.google.com/maps/dir/?api=1&origin=%D0%92%D0%BE%D0%B7%D0%BD%D0%B5%D1%81%D0%B5%D0%BD%D1%81%D0%BA%D0%B8%D0%B9%20%D0%BA%D0%B0%D1%84%D0%B5%D0%B4%D1%80%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D1%81%D0%BE%D0%B1%D0%BE%D1%80%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%93%D0%BE%D0%B3%D0%BE%D0%BB%D1%8F%2040%D0%92%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B&destination=Zhibek%20Zholy%20St%20%26%20Kunaev%20St%2C%20Almaty&travelmode=walking","names":{"almaty-panfilov-park":{"ru":"Парк имени 28 гвардейцев-панфиловцев","ko":"판필로프 28인 공원"},"almaty-green-bazaar":{"ru":"Зелёный базар","ko":"그린 바자르"},"almaty-arbat":{"ru":"Арбат","ko":"아르바트"}},"notes":[{"ru":"Парк и собор снаружи. Внутренний осмотр по желанию, с уважением к службе.","ko":"공원과 대성당 외관을 둘러봅니다. 내부 관람은 예배에 방해되지 않는 범위에서 선택하세요."},{"ru":"Ряды с фруктами, орехами и сладостями. Покупки по желанию.","ko":"과일과 견과류, 과자가 놓인 시장을 둘러봅니다. 구매는 선택입니다."},{"ru":"Прогулка по Арбату и время на обед. Здесь день можно закончить.","ko":"아르바트를 걸으며 식사할 여유를 둡니다. 여기서 하루 일정을 마쳐도 좋습니다."}],"start":{"ru":"Начните у Вознесенского собора в парке: Алматы, улица Гоголя, 40В. Если едете на такси, выбирайте доступную точку высадки у дороги рядом с парком и продолжайте пешком к собору. Машина не подъезжает к его дверям. Дальше весь день проходит пешком; время между остановками уже входит в общий план.","ko":"출발 기준은 공원 안의 승천 대성당, 고골 거리 40V입니다. 택시를 이용한다면 공원 주변에서 차량이 접근할 수 있는 도로를 하차 지점으로 고른 뒤 대성당까지 걸어가세요. 차량이 대성당 문 앞까지 들어가는 동선은 아닙니다. 이후에는 걸어서 이동하며 장소 사이의 이동 시간도 전체 일정에 포함됩니다."},"return":{"ru":"День заканчивается у западной части Арбата, возле проспекта Абылай хана. В Yandex Go укажите адрес своего жилья и выберите разрешённое место посадки у проезжей улицы. Если поели или закончили прогулку раньше, вызывайте машину к своему фактическому месту, за пределами пешеходной зоны.","ko":"산책은 아블라이 한 대로 부근, 아르바트 서쪽에서 끝납니다. Yandex Go에 숙소 주소를 입력하고 차량이 정차할 수 있는 도로에서 탑승하세요. 다른 곳에서 식사했거나 산책을 일찍 마쳤다면 보행자 구역 밖의 현재 위치를 기준으로 승차 지점을 고르면 됩니다."},"food":{"title":{"ru":"Перерыв на обед","ko":"점심과 휴식"},"body":{"ru":"После прогулки оставьте время на обед. В районе Арбата есть кафе и рестораны, где можно выбрать еду по меню и своему настроению.","ko":"산책을 마친 뒤에는 점심을 먹으며 쉬어 가세요. 아르바트 주변의 카페와 식당에서 메뉴를 살펴보고 마음에 드는 음식을 고를 수 있습니다."},"tip":{"ru":"Если меню трудно прочитать, можно воспользоваться переводом через камеру телефона. Для заказа удобно показать выбранное блюдо в меню.","ko":"메뉴를 읽기 어렵다면 휴대전화 카메라 번역을 활용해 보세요. 주문할 때는 메뉴에서 원하는 음식을 가리켜도 좋습니다."}}}</script><script>const data=JSON.parse(document.querySelector('#sample-data').textContent);let lang=new URLSearchParams(location.search).get('lang')==='ko'?'ko':'ru',monday=false;
const copy={ru:{title:'Первый день в Алматы',eyebrow:'БЕСПЛАТНЫЙ ПРИМЕР · ОДИН ГОРОДСКОЙ ДЕНЬ',intro:'После первой ночи можно спокойно познакомиться с центром. Парк, базар и Арбат займут около четырёх или пяти часов с обедом и паузами.',monday:'Гуляю в понедельник',replacement:'Сегодня без базара',details:'Осмотр и переход',start:'Где начать',map:'Начало на Google Maps',return:'Возвращение',weather:'Если устали или погода мешает',offer:'Что есть в полном путеводителе',offerBody:'Остальные дни, подготовка к прилёту и вылету, календарь, план ночёвок, перестановка дней и расчёт расходов собраны в одном комплекте.',back:'О путеводителе Алматы',print:'Печать / PDF',foot:'Это весь первый городской день, а не сокращённый список мест. Прогулку можно пройти самостоятельно. Питание, покупки и транспорт оплачиваются отдельно.'},ko:{title:'알마티에서 보내는 첫날',eyebrow:'무료 예시 · 도심에서 보내는 하루',intro:'첫날 밤을 푹 쉬었다면 다음 날은 도심부터 천천히 만나 보세요. 공원과 시장, 아르바트를 둘러보는 데 식사와 휴식을 포함해 네다섯 시간 정도를 잡으면 좋습니다.',monday:'월요일에 방문합니다',replacement:'오늘은 시장을 제외합니다',details:'둘러보기와 다음 이동',start:'산책을 시작하는 곳',map:'Google 지도에서 출발 지점 보기',return:'숙소로 돌아가기',weather:'피곤하거나 날씨가 좋지 않다면',offer:'전체 여행 안내에는 무엇이 있나요?',offerBody:'나머지 일정과 도착·출국 준비, 여행 달력과 숙박 구성, 일정 순서 변경, 지출 계산을 하나의 안내에서 이용할 수 있습니다.',back:'알마티 여행 안내 소개',print:'인쇄 / PDF',foot:'이 예시에는 첫 도심 일정 전체가 담겨 있습니다. 개별 여행으로 둘러볼 수 있으며 식사와 쇼핑, 교통비는 별도입니다.'}};
const tr=v=>v[lang],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const c=copy[lang];document.documentElement.lang=lang;document.title=c.title+' | Kazakhstan Guide';const stops=data.stops.filter(s=>!monday||s.placeId!=='almaty-green-bazaar');document.querySelector('#sample').innerHTML=`<header class="no-print"><a class="brand" href="../offer/?lang=${lang}">KAZAKHSTAN GUIDE</a><button data-language>${lang==='ru'?'한국어':'Русский'}</button></header><main id="main"><a class="no-print" href="../offer/?lang=${lang}">← ${c.back}</a><p class="eyebrow">${c.eyebrow}</p><h1>${c.title}</h1><p class="lead">${c.intro}</p><label class="no-print"><input type="checkbox" data-monday ${monday?'checked':''}>${c.monday}</label><div aria-live="polite"><p class="day-path">${stops.map(s=>esc(tr(data.names[s.placeId]))).join(' → ')}</p>${monday?`<div class="note" data-monday-note><strong>${c.replacement}</strong><p>${esc(tr(data.conditions[0].body))}</p></div>`:''}</div><section class="card"><h2>${c.start}</h2><p>${esc(tr(data.start))}</p><a class="button" href="${esc(data.startMapUrl)}" target="_blank" rel="noopener noreferrer">${c.map} ↗</a></section>${stops.map((s,i)=>`<article class="card" data-sample-stop="${s.placeId}"><p class="eyebrow">${i+1} · ${esc(tr(s.time))}</p><h2>${esc(tr(data.names[s.placeId]))}</h2><p>${esc(tr(data.notes[data.stops.indexOf(s)]))}</p><details open><summary>${c.details}</summary><p>${esc(tr(s.note))}</p><p>${esc(tr(monday&&s.placeId==='almaty-panfilov-park'?data.conditions[0].body:s.next))}</p>${(monday&&s.placeId==='almaty-panfilov-park'?data.mondayMapUrl:s.nextMapUrl)?`<a data-walk-link href="${esc(monday&&s.placeId==='almaty-panfilov-park'?data.mondayMapUrl:s.nextMapUrl)}" target="_blank" rel="noopener noreferrer">${lang==='ru'?'Пеший переход в Google Maps':'Google 지도에서 도보 이동 보기'} ↗</a>`:''}</details></article>`).join('')}<section class="card"><h2>${esc(tr(data.food.title))}</h2><p>${esc(tr(data.food.body))}</p><p class="muted">${esc(tr(data.food.tip))}</p></section><section class="note"><h2>${c.return}</h2><p>${esc(tr(data.return))}</p></section><details open><summary>${c.weather}</summary><p>${esc(tr(data.conditions[1].body))}</p></details><p class="muted">${c.foot}</p><div class="actions no-print"><button data-print>${c.print}</button></div><section class="card no-print"><h2>${c.offer}</h2><p>${c.offerBody}</p><a class="button primary" href="../offer/?lang=${lang}">${c.back} →</a></section></main><footer class="muted">Kazakhstan Guide</footer>`;}
document.addEventListener('click',e=>{if(e.target.closest('[data-language]')){lang=lang==='ru'?'ko':'ru';const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);render()}if(e.target.closest('[data-print]')){document.querySelectorAll('details').forEach(d=>d.open=true);window.print()}});document.addEventListener('change',e=>{if(e.target.matches('[data-monday]')){monday=e.target.checked;render();document.querySelector('[data-monday]').focus()}});render();</script><noscript>Для просмотра нужен JavaScript. / JavaScript를 켜 주세요.</noscript></body></html>
