</style></head><body><div id="product"></div><script type="application/json" id="product-data">{"title":{"ru":"Алматы. Своя поездка","ko":"알마티, 나에게 맞는 여행"},"intro":{"ru":"Пять полных дней, время устроиться после перелёта и спокойное возвращение домой.","ko":"도착 후 쉴 시간부터 귀국일까지, 온전한 다섯 날을 나에게 맞게 준비합니다."},"lodging":{"title":{"ru":"Ваше жильё","ko":"나의 숙소"},"body":{"ru":"Выберите отель, апартаменты или квартиру, которые подходят вам по расположению и условиям. Прогулки начинаются у достопримечательностей, поэтому менять жильё ради маршрута не нужно.","ko":"위치와 이용 조건에 맞춰 호텔이나 아파트형 숙소, 단기 임대 숙소를 자유롭게 고르세요. 산책은 관광지에서 시작하므로 일정에 맞추려고 숙소를 바꿀 필요는 없습니다."},"tip":{"ru":"Сохраните точный адрес и условия заезда. Для квартиры пригодится инструкция получения ключей, для любого жилья важно время доступа после прилёта.","ko":"정확한 주소와 입실 안내를 저장하세요. 단기 임대 숙소라면 열쇠나 출입 비밀번호를 받는 방법도 필요합니다. 어떤 숙소든 도착 후 언제 들어갈 수 있는지가 중요합니다."}},"food":{"title":{"ru":"Перерыв на обед","ko":"점심과 휴식"},"body":{"ru":"После прогулки оставьте время на обед. В районе Арбата есть кафе и рестораны, где можно выбрать еду по меню и своему настроению.","ko":"산책을 마친 뒤에는 점심을 먹으며 쉬어 가세요. 아르바트 주변의 카페와 식당에서 메뉴를 살펴보고 마음에 드는 음식을 고를 수 있습니다."},"tip":{"ru":"Если меню трудно прочитать, можно воспользоваться переводом через камеру телефона. Для заказа удобно показать выбранное блюдо в меню.","ko":"메뉴를 읽기 어렵다면 휴대전화 카메라 번역을 활용해 보세요. 주문할 때는 메뉴에서 원하는 음식을 가리켜도 좋습니다."}},"mountainTip":{"ru":"Работа канатных дорог зависит от погоды и технического обслуживания. Если подъём недоступен, можно выбрать городской день.","ko":"케이블카는 날씨와 정비 일정에 따라 운행이 달라질 수 있습니다. 올라갈 수 없는 날에는 도심 일정을 선택하세요."},"mountainAlerts":[{"from":"2026-10-19","to":"2026-11-01","body":{"ru":"На выбранную дату приходится объявленная профилактика линий Медеу, Комби-1 и Комби-2. Полный канатный маршрут в этот период недоступен. Выберите городской день вместо подъёма.","ko":"선택한 날짜는 메데우와 콤비 1·2의 공지된 정비 기간에 해당합니다. 이 기간에는 케이블카 전체 구간을 이용할 수 없으므로 도심 일정으로 바꾸세요."}},{"from":"2026-10-19","to":"2026-10-22","body":{"ru":"На выбранную дату объявлено перекрытие дороги у визит-центра Горельник для машин и пешеходов. Эта дорога не подходит как замена канатному подъёму.","ko":"선택한 날짜에는 고렐니크 방문자센터 인근 도로의 차량과 보행자 통행이 제한된다고 공지되어 있습니다. 이 도로를 케이블카 대신 이용하는 일정으로 잡지 마세요."}}],"stages":[{"id":"trip","label":{"ru":"Вся поездка","ko":"전체 일정"},"eyebrow":{"ru":"ПЯТЬ ПОЛНЫХ ДНЕЙ","ko":"온전한 다섯 날"},"title":{"ru":"Ваше время в Алматы","ko":"알마티에서 보낼 시간"},"lead":{"ru":"День прилёта и вылет отдельно. Выберите выезд к Чарыну, два дня у озёр или оставайтесь в Алматы.","ko":"도착일과 출국일은 따로 둡니다. 차른 방문, 호수에서의 이틀, 장거리 이동 없는 일정 중 선택하세요."},"cards":[]},{"id":"prepare","label":{"ru":"До вылета","ko":"출국 전"},"eyebrow":{"ru":"ПОДГОТОВИТЬ ОДИН РАЗ","ko":"미리 준비해 두기"},"title":{"ru":"Чтобы в аэропорту было проще","ko":"공항에서 덜 헤매도록"},"lead":{"ru":"Самое важное стоит сохранить ещё дома. После посадки не придётся искать всё заново.","ko":"중요한 내용을 출국 전에 저장해 두면 도착 후 다시 찾는 수고를 덜 수 있습니다."},"cards":[{"title":{"ru":"Проверьте вход в Yandex Go","ko":"Yandex Go 로그인 확인"},"body":{"ru":"Установите приложение и попробуйте войти со своим номером до вылета. Купленная eSIM для интернета сама по себе не обеспечивает получение SMS. Если вход не удался, сохраните ориентир резервной стойки Taxi Point в аэропорту.","ko":"출국 전에 앱을 설치하고 본인 번호로 로그인을 시도해 보세요. 데이터용 eSIM만으로는 일반 문자를 받을 수 없습니다. 로그인이 되지 않으면 공항의 예비 이동 수단인 Taxi Point 창구 위치를 저장해 두세요."}},{"title":{"ru":"Сохраните жильё и доступ в номер","ko":"숙소와 입실 정보 저장"},"body":{"ru":"Сохраните подтверждение, точный адрес и время заселения без интернета. При утреннем прилёте обычное время заселения может оказаться слишком поздним для отдыха сразу после дороги. Выбирайте условия проживания с подходящим временем доступа.","ko":"예약 확인서와 정확한 주소, 입실 시간을 인터넷 없이 볼 수 있게 저장하세요. 아침 도착이라면 정규 입실 시간까지 바로 쉬기 어려울 수 있습니다. 도착 후 쉴 수 있도록 입실 시간이 맞는 숙박 조건을 선택하세요."}},{"title":{"ru":"Оставьте резерв для оплаты и связи","ko":"결제와 통신의 예비 수단"},"body":{"ru":"Сохраните доступ к своему номеру и банковским подтверждениям. Для наличного расчёта нужны тенге. Работу любой корейской карты в приложении или терминале гарантировать нельзя.","ko":"본인 번호와 은행 인증 수단을 해외에서도 이용할 수 있도록 준비하세요. 현금 결제에는 텡게가 필요합니다. 모든 한국 카드가 앱이나 단말기에서 결제된다고 보장할 수는 없습니다."}}],"checks":[{"ru":"Вход в приложение проверен","ko":"앱 로그인 확인"},{"ru":"Бронирование и время доступа сохранены","ko":"예약과 입실 시간 저장"},{"ru":"Резерв прибытия предусмотрен","ko":"공항 이동의 예비 방법 준비"},{"ru":"Адрес и памятка доступны без сети","ko":"주소와 안내를 오프라인으로 저장"}]},{"id":"arrival","label":{"ru":"Прибытие","ko":"도착"},"eyebrow":{"ru":"ДЕНЬ ПРИЛЁТА · БЕЗ ГОНКИ","ko":"도착일 · 서두르지 않기"},"title":{"ru":"От аэропорта до отдыха","ko":"공항에서 숙소까지"},"lead":{"ru":"Сегодня достаточно добраться, устроиться и поесть. Прогулка остаётся по желанию.","ko":"오늘은 숙소에 도착해 짐을 풀고 식사하는 것만으로도 충분합니다. 산책은 여유가 있을 때 선택하세요."},"cards":[{"title":{"ru":"После получения багажа","ko":"짐을 찾은 뒤"},"body":{"ru":"Подключите подготовленный интернет. Бесплатная сеть аэропорта AIRPORT_Almaty требует код из SMS; получение кода на конкретный корейский номер не гарантировано. Если нужны наличные, в общей зоне международного терминала есть круглосуточный обмен валюты. Для расчёта нужны тенге. Связь и оплату удобнее подготовить внутри терминала, до выхода к машине.","ko":"준비한 통신 수단을 연결하세요. 공항 무료 와이파이 AIRPORT_Almaty는 문자 인증이 필요하며 한국 번호의 인증 문자 수신은 보장되지 않습니다. 현금이 필요하다면 국제선 터미널 일반 구역의 24시간 환전소를 이용할 수 있습니다. 현금 결제에는 텡게가 필요합니다. 차량을 만나기 전에 터미널 안에서 통신과 결제 수단을 준비해 두세요."}},{"title":{"ru":"Заказ и встреча","ko":"호출과 탑승"},"body":{"ru":"В Yandex Go укажите точный адрес своего жилья. Для отеля можно начать с названия, для квартиры используйте адрес из бронирования. До заказа выберите доступный способ оплаты. После назначения машины следуйте точке встречи в приложении и сверяйте номер автомобиля. Фраза встречающего «я из Yandex» не заменяет ваш заказ.","ko":"Yandex Go에 정확한 숙소 주소를 입력하세요. 호텔은 이름으로 찾을 수 있고 단기 임대 숙소는 예약에 적힌 주소를 사용하면 됩니다. 호출 전에 이용 가능한 결제 방식을 선택합니다. 배차 후에는 앱의 탑승 위치로 이동해 차량 번호를 대조하세요. 공항에서 자신을 Yandex 기사라고 소개하는 사람의 말만으로 탑승하지 마세요."}},{"title":{"ru":"Если приложение не работает","ko":"앱을 이용할 수 없다면"},"body":{"ru":"Внутри международного терминала на первом этаже у выходов A и B находится круглосуточная стойка с жёлтой вывеской TAXI POINT. Покажите сохранённый адрес жилья. До оформления поездки должны быть понятны итоговая сумма в тенге и доступный способ оплаты. Цена зависит от адреса и категории машины. Собственное приложение и интернет для обращения к стойке не нужны. Корейское обслуживание и приём любой корейской карты не подтверждены; для короткого обмена информацией может пригодиться переводчик.","ko":"국제선 터미널 1층 A·B 출구 부근에는 노란색 TAXI POINT 간판이 있는 24시간 택시 창구가 있습니다. 저장한 숙소 주소를 보여 주고 예약 전에 텡게 기준 총요금과 이용 가능한 결제 수단을 확인하세요. 목적지와 차량 등급에 따라 요금이 달라집니다. 창구를 이용하는 데 본인 휴대전화의 앱이나 인터넷은 필요하지 않습니다. 한국어 응대와 모든 한국 카드의 결제 가능 여부는 확인되지 않았으므로 짧은 내용을 주고받을 때 번역기를 활용할 수 있습니다."}}]},{"id":"evening","label":{"ru":"Отдых и вечер","ko":"휴식과 저녁"},"eyebrow":{"ru":"МОЖНО НИЧЕГО НЕ УСПЕВАТЬ","ko":"쉬어 가도 좋은 시간"},"title":{"ru":"Первое знакомство без спешки","ko":"가볍게 시작하는 첫 만남"},"lead":{"ru":"После отдыха выберите то, на что сегодня есть силы. Впереди полноценный день в городе.","ko":"쉬고 난 뒤 지금의 컨디션에 맞게 골라 보세요. 내일은 도시를 둘러볼 하루가 기다립니다."},"cards":[]},{"id":"day1","label":{"ru":"Первый полный день","ko":"첫 온전한 하루"},"eyebrow":{"ru":"ПОСЛЕ ПЕРВОЙ НОЧИ","ko":"첫날 밤을 보낸 뒤"},"title":{"ru":"Парк, базар и Арбат","ko":"공원과 시장, 아르바트"},"lead":{"ru":"Аллеи, цветной фасад собора и прогулка по центру. Около четырёх или пяти часов с едой и паузами.","ko":"공원 길과 대성당의 색채를 만나고 도심을 걸어봅니다. 식사와 휴식을 포함해 약 4~5시간을 생각해 두세요."},"cards":[]},{"id":"departure","label":{"ru":"Возвращение","ko":"귀국"},"eyebrow":{"ru":"ДЕНЬ ВЫЛЕТА","ko":"출국일"},"title":{"ru":"Возвращение начинается спокойно","ko":"여유 있게 시작하는 귀국일"},"lead":{"ru":"Вылет не входит в пять полных дней. После озёр сначала вернитесь и переночуйте в Алматы.","ko":"출국일은 온전한 다섯 날과 별개입니다. 호수 방문 후에는 먼저 알마티에 돌아와 하룻밤 쉬세요."},"cards":[{"title":{"ru":"Проверьте местные дату и время","ko":"현지 날짜와 시간"},"body":{"ru":"У ночного рейса календарная дата может отличаться от привычного «вечера отъезда». Ориентируйтесь на билет и правила регистрации вашей авиакомпании. Универсальное время выезда из отеля здесь не назначаем.","ko":"심야 항공편의 날짜는 생각하는 출발 저녁과 다를 수 있습니다. 항공권의 현지 날짜와 항공사 체크인 규정을 기준으로 준비하세요. 모든 항공편에 같은 숙소 출발 시간을 적용하지 않습니다."}},{"title":{"ru":"Выселение и багаж","ko":"체크아웃과 짐"},"body":{"ru":"Ориентируйтесь на время выезда в своём бронировании. Если до рейса остаётся много времени, учитывайте условия хранения багажа. В квартире возможность оставить вещи после выезда не подразумевается.","ko":"체크아웃 시간은 본인 예약 조건을 기준으로 준비하세요. 출국까지 시간이 많이 남는다면 짐 보관 조건도 생각해 두세요. 단기 임대 숙소에서는 퇴실 후 짐을 맡길 수 있다고 가정하지 않습니다."}},{"title":{"ru":"Дорога в аэропорт","ko":"공항으로 이동"},"body":{"ru":"Заранее сохраните аэропорт Алматы ALA и данные рейса. При заказе машины выберите доступную точку у входа жилья, проверьте способ оплаты и заложите время на дорожную ситуацию. Дальний выезд перед самолётом в программу не добавляем.","ko":"알마티 공항 ALA와 항공편 정보를 미리 저장하세요. 차량 호출 시 숙소 입구 근처의 접근 가능한 지점과 결제 방식을 확인하고 교통 상황에 여유를 두세요. 출국 직전에 장거리 방문을 추가하지 않습니다."}}]}],"arrival":{"morning":{"label":{"ru":"Утром","ko":"아침"},"title":{"ru":"Сначала время на отдых","ko":"먼저 쉬어 가기"},"body":{"ru":"После ночного перелёта оставьте время на сон. Если жильё уже доступно, отправляйтесь отдыхать. Если заселение позже, заранее выберите условия с ранним доступом. Иногда для отдыха сразу после приезда нужна предыдущая оплаченная ночь с согласованным временем прибытия. Хранение багажа может освободить руки, но не заменяет место для отдыха.","ko":"밤 비행 뒤에는 잠을 잘 시간을 남겨 두세요. 숙소에 바로 들어갈 수 있다면 먼저 쉬어 갑니다. 정규 입실이 늦다면 출국 전에 이른 입실이 가능한 조건을 선택하세요. 도착하자마자 쉬려면 전날 밤부터 예약하고 실제 도착 시간을 숙박 조건에 맞추어야 하는 경우도 있습니다. 짐 보관은 이동을 편하게 해 주지만 쉴 방을 대신하지는 않습니다."}},"afternoon":{"label":{"ru":"Днём","ko":"낮"},"title":{"ru":"Заселиться и выдохнуть","ko":"짐을 풀고 쉬어 가기"},"body":{"ru":"Доберитесь до своего жилья и заселитесь по условиям бронирования. После дороги оставьте время на душ, еду и отдых. Вечером можно поужинать поблизости, без отдельной поездки в центр.","ko":"선택한 숙소로 이동해 예약 조건에 맞춰 입실하세요. 이동 후에는 씻고 식사하며 쉴 시간을 남겨 둡니다. 저녁은 도심까지 따로 이동하지 않고 숙소 근처에서 먹어도 좋습니다."}},"night":{"label":{"ru":"Вечером или ночью","ko":"저녁 또는 심야"},"title":{"ru":"Жильё, еда по возможности, сон","ko":"숙소에 도착해 쉬기"},"body":{"ru":"У ночного заезда должны быть верные даты и подтверждённые условия доступа. Для квартиры сохраните порядок получения ключей или самостоятельного входа. При приезде после полуночи важна оплаченная ночь, которая даёт доступ к жилью, а не только дата в календаре. Сохраните условия до вылета. Не рассчитывайте на открытый ресторан после позднего прибытия. Утром программу можно начать позже.","ko":"심야 도착이라면 예약 날짜와 입실 가능 조건이 맞는지 미리 확인된 내용이 필요합니다. 단기 임대 숙소라면 열쇠 수령이나 셀프 체크인 방법도 저장하세요. 자정 이후 도착에는 달력 날짜뿐 아니라 실제 입실이 가능한 숙박일을 기준으로 준비해야 합니다. 출국 전에 안내를 저장해 두세요. 늦게 도착했을 때 식당이 열려 있을 것으로 가정하지 마세요. 다음 날은 늦게 시작해도 괜찮습니다."}}},"energy":{"rest":{"label":{"ru":"Только отдых","ko":"오늘은 휴식"},"title":{"ru":"Остаться в спокойном темпе","ko":"편안하게 쉬어 가기"},"body":{"ru":"Сегодня не нужно заслуживать отдых прогулкой. Поешьте, зарядите телефон и оставьте завтраку и городу время на утро. Если поздно, пригодится простая еда, подготовленная заранее.","ko":"쉬기 위해 먼저 관광을 해야 하는 것은 아닙니다. 식사하고 휴대전화를 충전한 뒤 내일을 기다려도 좋습니다. 늦은 도착에는 미리 준비해 둔 간단한 음식이 도움이 됩니다."}},"dinner":{"label":{"ru":"Поужинать рядом","ko":"가까운 곳에서 식사"},"title":{"ru":"Ужин без отдельной поездки","ko":"멀리 가지 않는 저녁 식사"},"body":{"ru":"После отдыха выберите кафе или ресторан рядом со своим жильём. В первый вечер достаточно спокойно поесть и вернуться отдыхать. Если прилетаете поздно, пригодится простая еда, подготовленная заранее.","ko":"쉬고 난 뒤 숙소 근처 카페나 식당에서 식사해 보세요. 첫날 저녁은 멀리 나가지 않고 식사한 뒤 쉬어도 충분합니다. 늦은 도착에는 미리 준비한 간단한 음식이 도움이 됩니다."}},"walk":{"label":{"ru":"Немного пройтись","ko":"가볍게 산책"},"title":{"ru":"Короткая прогулка рядом с жильём","ko":"숙소 근처에서 가볍게 걷기"},"body":{"ru":"Если ещё светло и есть силы, немного пройдитесь по окрестностям своего жилья. Необязательно ехать в центр или заранее проходить завтрашний маршрут. Сохраните адрес возвращения, а при усталости или плохой погоде оставьте вечер для отдыха.","ko":"아직 밝고 여유가 있다면 숙소 주변을 가볍게 걸어보세요. 도심까지 이동하거나 다음 날 코스를 미리 돌아볼 필요는 없습니다. 돌아갈 주소를 저장해 두고 피곤하거나 날씨가 좋지 않으면 숙소에서 쉬어 가세요."}}},"dayStart":{"ru":"Начните у Вознесенского собора: улица Гоголя, 40В. Если выбираете такси, точка высадки должна быть у доступной дороги, не у дверей собора внутри парка.","ko":"출발 기준은 고골 거리 40V의 승천 대성당입니다. 택시를 이용한다면 공원 안 대성당 문 앞이 아닌 차량이 접근할 수 있는 도로에서 내리세요."},"stopNotes":[{"ru":"Парк и собор снаружи. Внутренний осмотр по желанию, с уважением к службе.","ko":"공원과 대성당 외관을 둘러봅니다. 내부 관람은 예배에 방해되지 않는 범위에서 선택하세요."},{"ru":"Ряды с фруктами, орехами и сладостями. Покупки по желанию.","ko":"과일과 견과류, 과자가 놓인 시장을 둘러봅니다. 구매는 선택입니다."},{"ru":"Прогулка по Арбату и время на обед. Здесь день можно закончить.","ko":"아르바트를 걸으며 식사할 여유를 둡니다. 여기서 하루 일정을 마쳐도 좋습니다."}],"dayReturn":{"ru":"После прогулки вернитесь в своё жильё. Если оно рядом, можно пройти пешком по карте. Для поездки на такси выбирайте точку подачи у проезжей улицы рядом с местом окончания прогулки.","ko":"산책 후에는 머무는 숙소로 돌아갑니다. 가까운 곳이라면 지도를 보며 걸어가도 좋습니다. 택시를 이용할 때는 산책을 마친 곳 근처에서 차량이 접근할 수 있는 도로를 탑승 지점으로 선택하세요."},"tomorrow":{"ru":"Перед сном сохраните адрес начала прогулки. Если проснётесь позднее, сократите день, не пытайтесь наверстать все остановки.","ko":"잠들기 전에 내일 산책의 출발 주소를 저장하세요. 늦게 일어나면 일정을 줄여도 좋습니다. 모든 장소를 따라잡으려고 서두를 필요는 없습니다."},"journey":{"title":{"ru":"Алматы. Своя поездка","ko":"알마티, 나에게 맞는 여행"},"intro":{"ru":"Пять полных дней, время устроиться после перелёта и спокойное возвращение домой.","ko":"도착 후 쉴 시간부터 귀국일까지, 온전한 다섯 날을 나에게 맞게 준비합니다."},"modes":{"local":{"label":{"ru":"Без дальних выездов","ko":"장거리 이동 없이"},"note":{"ru":"Первые три дня остаются прежними. День 4 посвящён спокойному городу, день 5 Кок-Тобе. Все ночи в своём жилье в Алматы.","ko":"처음 사흘은 그대로 두고 4일차는 도심에서 여유롭게, 5일차는 콕토베에서 보냅니다. 모든 밤은 알마티 숙소에 머뭅니다."}},"city":{"label":{"ru":"Город и Чарын","ko":"도심과 차른"},"note":{"ru":"Дни 4 и 5: отдельный Чарын, затем Кок-Тобе и свободное время в Алматы.","ko":"4일차는 차른을 따로 방문하고 5일차는 콕토베와 도심의 여유 시간을 남깁니다."}},"lakes":{"label":{"ru":"Два дня у озёр","ko":"호수에서 이틀"},"note":{"ru":"Дни 4 и 5: Нижний Кольсай, ночь в Саты, Каинды и возвращение в Алматы. Чарын в эти два дня не добавляем.","ko":"4일차 하부 콜사이를 둘러보고 사티에서 숙박한 뒤, 5일차 카인디를 보고 알마티로 돌아옵니다. 이틀 일정에 차른을 추가하지 않습니다."}}},"common":[{"n":1,"title":{"ru":"Знакомство с центром","ko":"도심과 첫 만남"},"body":{"ru":"Парк Панфиловцев, собор снаружи, Зелёный базар и Арбат. Между остановками пешком, с временем на обед. В понедельник вместо базара выбираем прямой переход к Арбату.","ko":"판필로프 공원과 대성당 외관을 보고 그린 바자르, 아르바트로 걷습니다. 식사할 여유를 두며 월요일에는 시장을 제외하고 아르바트로 이어갑니다."},"load":{"ru":"Около 4 или 5 часов с паузами","ko":"휴식 포함 약 4~5시간"},"back":{"ru":"Своё жильё в Алматы","ko":"알마티에서 선택한 숙소"},"action":"day1","start":{"ru":"Из своего жилья к улице Гоголя, 40В, затем пешком по центру. Высадка у доступной дороги рядом с парком.","ko":"숙소에서 고골 거리 40V 부근으로 이동한 뒤 도심을 걷습니다. 공원 옆 차량이 접근 가능한 도로에서 내리세요."},"return":{"ru":"От Арбата пешком, если жильё рядом, или на Yandex Go от проезжей улицы. Адрес своего жилья сохраните заранее.","ko":"아르바트에서 숙소가 가까우면 걷거나 차량이 접근 가능한 도로에서 Yandex Go를 이용하세요. 숙소 주소는 미리 저장해 두세요."},"map":"Вознесенский кафедральный собор, Гоголя 40В, Алматы","food":{"ru":"Обед удобно оставить на Арбат и соседние улицы. Кафе выбирайте по своему настроению, привязывать весь день к одному заведению не нужно.","ko":"아르바트와 주변 거리에서 식사할 시간을 남겨 두세요. 마음에 드는 카페를 고르면 되며 특정 식당에 하루 일정을 맞출 필요는 없습니다."}},{"n":2,"title":{"ru":"День в горах","ko":"산에서 보내는 하루"},"body":{"ru":"От нижней станции Медеу поднимитесь к Шымбулаку. Верхний участок оставьте по силам и погоде. Катание на коньках и лыжах в эту прогулку не входит.","ko":"메데우 하부 승강장에서 심불라크로 올라갑니다. 상부 구간은 컨디션과 날씨에 따라 선택하세요. 스케이트와 스키는 이 일정에 포함되지 않습니다."},"load":{"ru":"Один горный день, без второго большого выезда","ko":"다른 장거리 방문을 더하지 않는 하루"},"back":{"ru":"Спуск по тем же линиям, затем в своё жильё","ko":"같은 노선으로 내려온 뒤 숙소로 귀환"},"routeId":"route-3d","map":"Медеу, нижняя станция канатной дороги Шымбулак","food":{"ru":"Еда у курорта по выбранному меню. На обратный спуск оставьте запас, не привязывайте его к последней минуте работы.","ko":"리조트에서 메뉴를 골라 식사합니다. 운행 종료 직전까지 머무르지 말고 하산에 여유를 두세요."},"alternative":{"ru":"Если линии закрыты, используйте спокойный городской день: выбранный музей при доступности или Dostyk Plaza. Горный день можно переставить, если другие дни подходят.","ko":"케이블카가 쉬는 날에는 개관한 미술관이나 Dostyk Plaza를 선택하세요. 다른 날의 조건이 맞는다면 산악 일정을 옮길 수 있습니다."},"start":{"ru":"На Yandex Go к нижней станции канатной дороги «Медеу». Не выбирайте курорт Шымбулак наверху как точку высадки.","ko":"Yandex Go 목적지는 아래쪽 메데우 케이블카 승강장입니다. 산 위의 심불라크 리조트를 하차 지점으로 선택하지 마세요."},"return":{"ru":"Спуск с пересадками до Медеу, затем новая поездка к своему жилью. Утренний заказ такси не включает ожидание до вечера.","ko":"케이블카를 갈아타며 메데우까지 내려온 뒤 숙소행 차량을 새로 호출합니다. 아침 택시에 저녁까지의 대기가 포함되지는 않습니다."}},{"n":3,"title":{"ru":"Город по вашим интересам","ko":"관심사에 맞춘 도심 하루"},"body":{"ru":"После гор не нужно устраивать ещё один ранний выезд. Выберите искусство или покупки, оставьте время на еду и подготовку к завтрашней дороге.","ko":"산에 다녀온 다음 날까지 이른 출발을 이어갈 필요는 없습니다. 미술관이나 쇼핑 중 하나를 고르고 식사와 다음 날 준비에 시간을 남겨 두세요."},"load":{"ru":"Одна основная остановка и свободный остаток дня","ko":"주요 방문 한 곳과 여유 시간"},"back":{"ru":"В своё жильё в Алматы","ko":"알마티 숙소로 귀환"},"culture":true,"start":{"ru":"Выберите одну основную остановку ниже. До неё удобнее доехать на такси из своего жилья.","ko":"아래에서 주요 방문 한 곳을 고르세요. 숙소에서 택시로 이동하면 편리합니다."},"return":{"ru":"После осмотра и еды возвращайтесь в своё жильё. Если завтра дальний выезд, оставьте вечер на отдых и сборы.","ko":"관람과 식사 후에는 숙소로 돌아갑니다. 다음 날 장거리 방문이 있다면 저녁에는 쉬며 준비하세요."}}],"city":[{"n":4,"title":{"ru":"Чарын: день в каньоне","ko":"차른 협곡에서 보내는 하루"},"body":{"ru":"Отдельный выезд к каньону. Начните с панорамы сверху, затем решите, насколько далеко идти в Долине замков. Спуск к реке необязателен, обратный подъём входит в нагрузку.","ko":"협곡을 따로 방문하는 날입니다. 먼저 상부 전망을 보고 성의 계곡에서 얼마나 걸을지 정하세요. 강까지 내려갈 필요는 없으며 돌아오는 오르막도 생각해야 합니다."},"load":{"ru":"Отдельный день; на месте около 3 или 4 часов","ko":"별도 하루, 현장 약 3~4시간"},"back":{"ru":"В ту же машину, затем в Алматы","ko":"기다리는 같은 차량으로 알마티 귀환"},"routeId":"route-3d-charyn","pending":true,"food":{"ru":"На выезд нужны вода и предусмотренная еда. Не считайте остановку на обед включённой, если её нет в условиях выбранной поездки.","ko":"물과 식사 계획이 필요합니다. 선택한 서비스 조건에 없으면 점심이 포함된 것으로 생각하지 마세요."},"alternative":{"ru":"При неподготовленной машине или непригодной погоде оставайтесь в Алматы. Этот день не заменяется обычным односторонним заказом такси.","ko":"왕복 차량이 마련되지 않았거나 날씨가 맞지 않으면 알마티에 머무르세요. 편도 택시 호출로 대신할 수 있는 일정이 아닙니다."},"start":{"ru":"Из Алматы с заранее организованным водителем или в составе выбранной поездки. Нужен подъезд к Долине замков, время на прогулку и возвращение в тот же день.","ko":"알마티에서 미리 마련한 기사 차량이나 선택한 현지 일정으로 출발합니다. 성의 계곡 접근과 산책 시간, 당일 귀환이 모두 포함된 이동 계획이 필요합니다."},"return":{"ru":"К тому же водителю в сохранённую точку встречи, затем к своему жилью в Алматы. Не рассчитывайте искать обратную машину у каньона.","ko":"저장해 둔 만남 장소에서 같은 기사와 만나 알마티 숙소로 돌아갑니다. 협곡에서 귀환 차량을 즉석으로 구하는 계획은 피하세요."},"map":"Чарынский каньон, Долина замков, Казахстан"},{"n":5,"title":{"ru":"Кок-Тобе и свободное завершение","ko":"콕토베와 여유로운 마무리"},"body":{"ru":"Выберите подъём на Кок-Тобе и прогулку у панорамы. Затем обед и свободное время. Этот день можно сократить до еды и отдыха, если после Чарына хочется тишины.","ko":"콕토베에 올라 전망을 보고 걸어봅니다. 이후에는 식사와 자유 시간을 남깁니다. 차른 방문 뒤 피곤하다면 식사하고 쉬는 하루로 줄여도 좋습니다."},"load":{"ru":"Подъём и прогулка, без обязательных аттракционов","ko":"케이블카와 산책, 놀이시설은 선택"},"back":{"ru":"Спуск к нижней станции и возвращение в жильё","ko":"하부 승강장으로 내려와 숙소로 귀환"},"placeId":"kok-tobe","map":"Алматы, проспект Достык, 104Б","food":{"ru":"Поесть можно после спуска в городе. Ужин наверху не является обязательной частью дня.","ko":"하산 후 시내에서 식사할 수 있습니다. 정상 식당에서의 저녁은 필수 일정이 아닙니다."},"alternative":{"ru":"В ветер или при остановке линии оставьте этот день городским. Видимость панорамы зависит от погоды.","ko":"바람이나 운행 중단 시에는 도심에서 보내세요. 전망이 보이는 정도도 날씨에 따라 달라집니다."},"start":{"ru":"Из своего жилья к нижней станции на Достык, 104Б. Подъём канатной дорогой и короткая прогулка наверху.","ko":"숙소에서 도스틱 대로 104B의 하부 승강장으로 이동해 케이블카를 타고 올라가 산책합니다."},"return":{"ru":"По той же канатной дороге вниз, затем пешком или на такси к своему жилью. Доступность линии и обратного спуска важнее красивого времени заката.","ko":"같은 케이블카로 내려온 뒤 걷거나 택시로 숙소에 돌아갑니다. 일몰 시간보다 왕복 운행 가능 여부를 우선하세요."}}],"lakes":[{"n":4,"title":{"ru":"Нижний Кольсай и ночь в Саты","ko":"하부 콜사이와 사티 숙박"},"body":{"ru":"После дороги оставьте время на обзорную зону и доступную часть берега Нижнего Кольсая. Поход к верхним озёрам в этот день не включён. Затем возвращение в заранее выбранное жильё в Саты.","ko":"이동 후에는 하부 콜사이 전망과 개방된 호숫가를 둘러봅니다. 상부 호수 산행은 포함하지 않습니다. 이후 사티에 미리 정한 숙소로 돌아갑니다."},"load":{"ru":"Дорога и около 2 или 3 часов у озера","ko":"차량 이동과 호숫가 약 2~3시간"},"back":{"ru":"Ночёвка в Саты, не в Алматы","ko":"알마티가 아닌 사티에서 숙박"},"routeId":"route-3d-kolsai","stopId":"almaty-kolsai","pending":true,"food":{"ru":"Еду в дороге и ужин в Саты нужно предусмотреть вместе с ночёвкой. Наличие жилья само по себе не означает включённое питание.","ko":"이동 중 식사와 사티 저녁을 숙박과 함께 계획하세요. 숙소 예약만으로 식사가 포함되는 것은 아닙니다."},"alternative":{"ru":"Если подходящего жилья и полной перевозки нет, не начинайте эту двухдневную часть. Выберите городскую программу.","ko":"적절한 숙소와 전체 이동편이 없으면 이틀 코스를 시작하지 말고 도심 일정을 선택하세요."},"start":{"ru":"Из Алматы с транспортом на оба дня. Условия должны охватывать Нижний Кольсай, жильё в Саты, подъезд к Каинды и возвращение в Алматы.","ko":"알마티에서 이틀 전체 이동편으로 출발합니다. 하부 콜사이, 사티 숙소, 카인디 접근과 알마티 귀환까지 이어져야 합니다."},"return":{"ru":"По Проверьте местные дату и время","ko":"현지 날짜와 시간"},"body":{"ru":"У ночного рейса календарная дата может отличаться от привычного «вечера отъезда». Ориентируйтесь на билет и правила регистрации вашей авиакомпании. Универсальное время выезда из отеля здесь не назначаем.","ko":"심야 항공편의 날짜는 생각하는 출발 저녁과 다를 수 있습니다. 항공권의 현지 날짜와 항공사 체크인 규정을 기준으로 준비하세요. 모든 항공편에 같은 숙소 출발 시간을 적용하지 않습니다."}},{"title":{"ru":"Выселение и багаж","ko":"체크아웃과 짐"},"body":{"ru":"Ориентируйтесь на время выезда в своём бронировании. Если до рейса остаётся много времени, учитывайте условия хранения багажа. В квартире возможность оставить вещи после выезда не подразумевается.","ko":"체크아웃 시간은 본인 예약 조건을 기준으로 준비하세요. 출국까지 시간이 많이 남는다면 짐 보관 조건도 생각해 두세요. 단기 임대 숙소에서는 퇴실 후 짐을 맡길 수 있다고 가정하지 않습니다."}},{"title":{"ru":"Дорога в аэропорт","ko":"공항으로 이동"},"body":{"ru":"Заранее сохраните аэропорт Алматы ALA и данные рейса. При заказе машины выберите доступную точку у входа жилья, проверьте способ оплаты и заложите время на дорожную ситуацию. Дальний выезд перед самолётом в программу не добавляем.","ko":"알마티 공항 ALA와 항공편 정보를 미리 저장하세요. 차량 호출 시 숙소 입구 근처의 접근 가능한 지점과 결제 방식을 확인하고 교통 상황에 여유를 두세요. 출국 직전에 장거리 방문을 추가하지 않습니다."}}]},"expenses":{"ru":"Здесь можно собрать свой расчёт в тенге. Пустое поле означает неизвестную сумму, а не бесплатную услугу. Стоимость перевозки указывается за всю компанию, еды и билетов на человека. Это расчёт по вашим данным, не предложение продажи.","ko":"텡게로 예상 지출을 정리할 수 있습니다. 빈칸은 무료가 아닌 미정 금액입니다. 차량은 일행 전체 금액, 식사와 입장료는 1인 금액을 입력하세요. 입력값에 따른 계산이며 판매 견적은 아닙니다."},"local":[{"n":4,"title":{"ru":"День для себя в городе","ko":"나를 위한 도심의 하루"},"body":{"ru":"После первых прогулок можно выспаться и провести день без раннего старта. Если хочется сменить обстановку, загляните в Esentai Mall: здесь интересны люксовые витрины и спокойная пауза на еду. Покупки по желанию.","ko":"첫 며칠의 산책 뒤에는 늦게 일어나 여유롭게 하루를 시작해도 좋습니다. 분위기를 바꾸고 싶다면 Esentai Mall에서 럭셔리 브랜드 쇼윈도를 둘러보고 식사하며 쉬어 보세요. 구매는 선택입니다."},"load":{"ru":"Одна остановка на е канатной дороге вниз, затем пешком или на такси к своему жилью. Доступность линии и обратного спуска важнее красивого времени заката.","ko":"같은 케이블카로 내려온 뒤 걷거나 택시로 숙소에 돌아갑니다. 일몰 시간보다 왕복 운행 가능 여부를 우선하세요."}}],"outskirtsReady":[{"ru":"Понятны дата, место встречи, время выезда и конечная точка возвращения.","ko":"날짜와 만남 장소, 출발 시간, 최종 귀환 장소가 정해져 있습니다."},{"ru":"Из условий видно, кто организует поездку, что оплачено и как действовать при отмене. Время ожидания водителя входит в план.","ko":"이동 서비스 제공자와 결제 내역, 취소 시 처리 방법이 명확합니다. 기사 대기 시간도 계획에 포함됩니다."},{"ru":"Адреса, контакты выбранной услуги и условия сохранены на телефоне. Важные детали понятны без звонка на местном языке.","ko":"주소와 선택한 서비스의 연락처, 이용 조건을 휴대전화에 저장했습니다. 중요한 내용을 현지어 전화 없이 이해할 수 있습니다."},{"ru":"Для озёр подготовлены ночь в Саты, еда, подъезд к обоим озёрам и обратная дорога в Алматы.","ko":"호수 일정은 사티 숙박과 식사, 두 호수 접근, 알마티 귀환까지 준비되어 있습니다."}],"ticketReference":{"shymbulak":12000,"koktobe":10000,"museum":5000}},"firstDay":{"stops":[{"placeId":"almaty-panfilov-park","period":{"ru":"Начало прогулки","ko":"산책의 시작"},"time":{"ru":"Около часа","ko":"약 1시간"},"note":{"ru":"Пройдите по аллеям парка, остановитесь у мемориала и рассмотрите Вознесенский собор снаружи. Внутренний осмотр оставьте по желанию, не мешая службе. Музей и экскурсия в основной план не входят.","ko":"공원 길을 걸으며 기념 공간을 둘러보고 승천 대성당의 외관을 감상합니다. 내부는 예배에 방해되지 않는 범위에서 선택적으로 방문하세요. 박물관 관람이나 해설 투어는 기본 일정에 포함하지 않습니다."},"next":{"ru":"Из парка направляйтесь к улице Пушкина, затем к проспекту Жибек Жолы и Зелёному базару. На переход с выходом из парка оставьте около двадцати минут.","ko":"공원에서 푸시킨 거리 쪽으로 나와 지벡 졸르 대로의 그린 바자르로 향합니다. 공원 밖으로 나오는 시간을 포함해 이동에 약 20분을 남겨 두세요."}},{"placeId":"almaty-green-bazaar","period":{"ru":"Следующая остановка","ko":"시장 둘러보기"},"time":{"ru":"Около часа","ko":"약 1시간"},"note":{"ru":"Пройдите вдоль рядов с фруктами, орехами и сладостями. Покупать что-то не обязательно. Если выбираете сухофрукты, учитывайте вес: цена может быть указана за килограмм. По понедельникам базар пропускаем.","ko":"과일과 견과류, 과자가 놓인 가판대를 천천히 둘러봅니다. 물건을 사지 않아도 좋습니다. 말린 과일을 고른다면 표시 가격이 1kg 기준일 수 있다는 점을 기억하세요. 월요일에는 시장을 제외합니다."},"next":{"ru":"От базара идите по Жибек Жолы на запад, в сторону улицы Панфилова. На переход до начала прогулки по Арбату оставьте около получаса с запасом на светофоры и остановки.","ko":"시장에서 지벡 졸르 대로를 따라 서쪽의 판필로프 거리 방향으로 걷습니다. 신호 대기와 잠깐의 휴식을 고려해 아르바트까지 약 30분을 잡으면 여유가 있습니다."}},{"placeId":"almaty-arbat","period":{"ru":"Прогулка и обед","ko":"아르바트와 식사"},"time":{"ru":"Около полутора или двух часов с едой","ko":"식사 포함 약 1시간 30분~2시간"},"note":{"ru":"У пересечения Жибек Жолы и Панфилова начинается следующая часть дня. Пройдите по Арбату в сторону проспекта Абылай хана, рассматривая витрины и работы художников, если они выставлены. Здесь удобно сделать паузу на еду. Уличная музыка бывает не каждый день.","ko":"지벡 졸르와 판필로프 거리가 만나는 곳에서 아르바트 산책을 이어 갑니다. 아블라이 한 대로 방향으로 걸으며 상점과 전시된 거리 작품을 둘러보세요. 이 구간에서 식사 시간을 가질 수 있습니다. 거리 음악은 매일 있는 프로그램이 아닙니다."},"next":{"ru":"После обеда прогулку можно закончить. Если остались силы, вернитесь к Панфилова и пройдите по пешеходной части в сторону Гоголя. Это необязательное продолжение.","ko":"식사 후에는 일정을 마쳐도 좋습니다. 더 걷고 싶다면 판필로프 거리로 돌아와 고골 거리 방향의 보행자 구간을 둘러볼 수 있습니다. 선택적으로 더하는 산책입니다."}}],"conditions":[{"title":{"ru":"Если это понедельник","ko":"월요일이라면"},"body":{"ru":"После парка идите к Арбату по улице Гоголя до Панфилова, затем к Жибек Жолы. Базар в этот день не включён. Оставьте больше времени на обед или закончите раньше.","ko":"공원에서 고골 거리를 따라 판필로프 거리로 간 뒤 지벡 졸르 쪽으로 걸으면 아르바트에 닿습니다. 이날은 시장을 방문하지 않습니다. 식사에 시간을 더 쓰거나 일정을 일찍 마칠 수 있습니다."}},{"title":{"ru":"Если устали или погода мешает","ko":"피곤하거나 날씨가 좋지 않다면"},"body":{"ru":"Остановитесь после парка или базара и вернитесь в жильё. Зимой и после осадков дорожки могут быть скользкими. В жаркий день делайте паузы в помещении. Прогулка почти целиком проходит на улице.","ko":"공원이나 시장을 둘러본 뒤 숙소로 돌아가도 좋습니다. 겨울이나 비가 온 뒤에는 길이 미끄러울 수 있습니다. 더운 날에는 실내에서 쉬어 가세요. 이 일정은 대부분 야외 산책입니다."}}]},"names":{"almaty-panfilov-park":{"ru":"Парк имени 28 гвардейцев-панфиловцев","ko":"판필로프 28인 공원"},"almaty-ascension-cathedral":{"ru":"Вознесенский кафедральный собор","ko":"알마티 승천 대성당"},"almaty-green-bazaar":{"ru":"Зелёный базар","ko":"그린 바자르"},"almaty-first-president-park":{"ru":"Парк Первого Президента","ko":"초대 대통령 공원"},"almaty-shymbulak":{"ru":"Горный курорт Шымбулак","ko":"심불라크 산악 리조트"},"kok-tobe":{"ru":"Кок-Тобе","ko":"콕토베"},"almaty-central-mosque":{"ru":"Центральная мечеть Алматы","ko":"알마티 중앙 모스크"},"almaty-central-park":{"ru":"Центральный парк отдыха Алматы","ko":"알마티 중앙공원"},"almaty-central-museum":{"ru":"Национальный центральный музей Республики Казахстан","ko":"카자흐스탄 중앙박물관"},"almaty-zoo":{"ru":"Алматинский зоопарк","ko":"알마티 동물원"},"almaty-kasteev-museum":{"ru":"Национальный музей искусств Республики Казахстан имени Абылхана Кастеева","ko":"카스테예프 국립미술관"},"ile-alatau-park":{"ru":"Иле-Алатауский национальный парк / Іле-Алатау ұлттық саябағы","ko":"일레알라타우 국립공원"},"almaty-abai-theatre":{"ru":"Казахский национальный театр оперы и балета имени Абая","ko":"아바이 국립 오페라·발레 극장"},"almaty-museum-instruments":{"ru":"Музей народных музыкальных инструментов имени Ыхласа","ko":"이흘라스 민속악기 박물관"},"almaty-botanical-garden":{"ru":"Главный ботанический сад Алматы","ko":"알마티 주식물원"},"almaty-independence-monument":{"ru":"Монумент Независимости","ko":"독립 기념비"},"almaty-bao":{"ru":"Большое Алматинское озеро","ko":"빅 알마티 호수"},"almaty-dostyk-plaza":{"ru":"Dostyk Plaza","ko":"도스틱 플라자"},"almaty-nikolsky-cathedral":{"ru":"Никольский собор","ko":"성 니콜라스 대성당"},"almaty-charyn":{"ru":"Чарынский каньон","ko":"차른 협곡"},"almaty-esentai-mall":{"ru":"Esentai Mall","ko":"에센타이 몰"},"almaty-gorelnik":{"ru":"Ущелье Горельник","ko":"고렐니크 계곡"},"almaty-oi-qaragai":{"ru":"Горный курорт Oi-Qaragai / Лесная Сказка","ko":"오이카라가이 리조트"},"almaty-kolsai":{"ru":"Кольсайские озёра","ko":"콜사이 호수"},"almaty-kaindy":{"ru":"Озеро Каинды","ko":"카인디 호수"},"almaty-medeu-sports-complex":{"ru":"Спортивный комплекс Медеу","ko":"메데우 스포츠 단지"},"almaty-ak-bulak":{"ru":"Ак-Булак","ko":"악불락"},"almaty-pioneer":{"ru":"Pioneer","ko":"피오니어"},"almaty-issyk":{"ru":"Озеро Есик","ko":"예식 호수"},"almaty-alma-arasan":{"ru":"Ущелье Алма-Арасан","ko":"알마 아라산 계곡"},"almaty-ayusai":{"ru":"Ущелье Аюсай","ko":"아유사이 계곡"},"almaty-butakovsky-waterfall":{"ru":"Бутаковский водопад","ko":"부타콥스키 폭포"},"almaty-kok-zhailau":{"ru":"Кок-Жайляу","ko":"콕자일라우"},"almaty-furmanov":{"ru":"Пик Фурманова","ko":"푸르마노프 봉"},"almaty-japanese-road":{"ru":"Старая японская дорога","ko":"옛 일본 도로"},"almaty-mynzhylky":{"ru":"Урочище Мынжылкы","ko":"민질키 계곡"},"almaty-medvezhiy-waterfall":{"ru":"Медвежий водопад в Тургене","ko":"투르겐 메드베지 폭포"},"almaty-altyn-emel":{"ru":"Алтын-Эмель","ko":"알틴 에멜"},"almaty-assy":{"ru":"Плато Ассы","ko":"아시 고원"},"almaty-tamgaly-tas":{"ru":"Тамгалы-Тас на Или","ko":"일리강 탐갈리 타스"},"almaty-arbat":{"ru":"Арбат","ko":"아르바트"},"almaty-tanbaly":{"ru":"Танбалы, петроглифы ЮНЕСКО","ko":"탄발리 유네스코 암각화"}},"places":{"almaty-kasteev-museum":{"name":{"ru":"Национальный музей искусств Республики Казахстан имени Абылхана Кастеева","ko":"카스테예프 국립미술관"},"visitor":{"address":{"ru":"Алматы, микрорайон Коктем-3, 22/1. Это основной музей, не дом-музей художника.","ko":"본관의 현지 주소는 Алматы, мкр. Коктем-3, 22/1입니다. 화가의 가옥 박물관과 다른 장소입니다."},"transport":{"ru":"Выберите городской маршрут или такси к основному зданию музея.","ko":"본관 건물을 목적지로 대중교통이나 택시를 이용하세요."},"hours":{"ru":"Со вторника по воскресенье с 10:00 до 18:00, касса до 17:30. Понедельник и последний день месяца выходные.","ko":"화요일부터 일요일 10:00~18:00, 매표소는 17:30까지입니다. 월요일과 매월 마지막 날은 쉽니다."},"price":{"ru":"Взрослый билет 2 000 KZT. Студентам и пенсионерам 1 000 KZT, школьникам 500 KZT при подтверждении льготной категории.","ko":"성인 요금은 2 000 KZT입니다. 대학생과 연금 수급자는 1 000 KZT, 초·중·고 학생은 500 KZT로 안내되며 해당 자격을 증명해야 합니다."},"duration":{"ru":"От полутора до трёх часов на основную экспозицию.","ko":"주요 전시 관람은 약 1시간 30분에서 3시간을 기준으로 생각할 수 있습니다."},"access":{"ru":"Понедельник выходной. Последний день месяца санитарный.","ko":"월요일은 휴관일이며 매월 마지막 날은 정기 정비일입니다."},"gaps":{"ru":"Не подтверждены отдельные условия посещения. Ниже сохранены ссылки на использованные источники; неизвестные часы и тарифы не выдаются за действующие.","ko":"일부 방문 조건은 아직 확인되지 않았습니다. 검토에 사용한 출처를 아래에 남겼으며 미확인 운영 시간과 요금은 확정 정보로 제시하지 않습니다."}},"mapUrl":"https://www.google.com/maps/search/?api=1&query=%D0%9D%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%BC%D1%83%D0%B7%D0%B5%D0%B9%20%D0%B8%D1%81%D0%BA%D1%83%D1%81%D1%81%D1%82%D0%B2%20%D0%B8%D0%BC%D0%B5%D0%BD%D0%B8%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%B5%D0%B2%D0%B0%2C%20%D0%9A%D0%BE%D0%BA%D1%82%D0%B5%D0%BC-3%2C%2022%2F1%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B","card":{"ru":"В музее Кастеева можно посмотреть на Казахстан глазами художников. Картины и другие произведения дают повод задержаться у того, что привлекло внимание. Для самостоятельного осмотра знание местного языка не обязательно, но корейские пояснения не подтверждены.","ko":"카스테예프 미술관에서는 작품을 통해 카자흐스탄을 다른 시선으로 만날 수 있습니다. 마음에 드는 작품 앞에서 여유를 갖고 감상하기 좋은 곳입니다. 개별 관람은 가능하지만 한국어 전시 설명은 확인되지 않았습니다."}},"almaty-dostyk-plaza":{"name":{"ru":"Dostyk Plaza","ko":"도스틱 플라자"},"visitor":{"address":{"ru":"Алматы, микрорайон Самал-2, 111. Угол проспекта Достык и улицы Жолдасбекова.","ko":"사말 2 지역 111번지, 도스틱 대로와 졸다스베코바 거리 교차로에 있습니다."},"transport":{"ru":"Для такси можно скопировать адрес ниже. Dostyk Plaza и Esentai Mall находятся в разных местах.","ko":"아래의 현지 주소를 복사해 택시 목적지로 사용할 수 있습니다. Dostyk Plaza와 Esentai Mall은 다른 장소에 있습니다."},"hours":{"ru":"Ежедневно с 10:00 до 22:00. У отдельных магазинов и заведений собственные часы.","ko":"매일 10:00~22:00이며 개별 매장과 식당의 운영 시간은 다를 수 있습니다."},"price":null,"duration":{"ru":"Один или два часа на магазины и обед.","ko":"쇼핑과 식사에 약 1시간에서 2시간을 생각할 수 있습니다."},"access":{"ru":"Магазины, супермаркет и кинотеатр имеют разные часы работы.","ko":"매장과 슈퍼마켓, 영화관의 영업 시간은 서로 다릅니다."},"gaps":{"ru":"Корейское обслуживание и корейское меню. Каталог подтверждает бренды, но не наличие каждой модели.","ko":"한국어 응대와 메뉴입니다. 매장 목록은 브랜드 입점을 확인하는 자료이며 모든 상품의 재고를 보장하지 않습니다."}},"mapUrl":"https://www.google.com/maps/search/?api=1&query=Dostyk%20Plaza%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B%2C%20%D0%9A%D0%B0%D0%B7%D0%B0%D1%85%D1%81%D1%82%D0%B0%D0%BD","card":{"ru":"Dostyk Plaza подойдёт для повседневных покупок и обеда между прогулками. Здесь можно посмотреть одежду, косметику и технику. Если интересны именно люксовые бутики, у Esentai Mall другой характер покупок.","ko":"Dostyk Plaza는 일상적인 쇼핑과 산책 사이의 식사에 어울립니다. 의류와 화장품, 전자제품을 살펴볼 수 있으며 럭셔리 부티크를 찾는다면 Esentai Mall과 비교해 보세요."}},"kok-tobe":{"name":{"ru":"Кок-Тобе","ko":"콕토베"},"visitor":{"address":{"ru":"Нижняя станция канатной дороги: проспект Достык, 104Б.","ko":"케이블카 하부 승강장은 도스틱 대로 104B에 있습니다. 정상 공원의 주소와 구분하세요."},"transport":{"ru":"Выберите канатную дорогу или пассажирский микроавтобус. У каждого способа свои билеты, часы и места посадки.","ko":"케이블카와 승객용 미니버스 중 이동 방법을 고르세요. 티켓과 운영 시간, 탑승 위치는 각각 다릅니다."},"hours":{"ru":"Канатная дорога работает в понедельник, среду, четверг и воскресенье с 10:00 до 22:00. Во вторник с 13:00 до 22:00. В пятницу, субботу и праздники с 10:00 до 23:00.","ko":"케이블카는 월요일, 수요일, 목요일, 일요일에 10:00부터 22:00까지 운행합니다. 화요일은 13:00부터 22:00까지, 금요일과 토요일 및 공휴일은 10:00부터 23:00까지로 안내되어 있습니다."},"price":{"ru":"Канатная дорога: взрослый билет 6 000 KZT в одну сторону и 10 000 KZT туда и обратно. Детям от 6 до 12 лет включительно 3 000 KZT и 5 000 KZT соответственно. Оператор требует свидетельство о рождении. Условия для иностранного документа уточняются отдельно.","ko":"케이블카 성인 요금은 편도 6 000 KZT, 왕복 10 000 KZT입니다. 6세부터 12세까지 어린이는 편도 3 000 KZT, 왕복 5 000 KZT입니다. 운영자는 출생증명서를 요구하며 해외 서류로 나이를 증명하는 방법은 아직 확인되지 않았습니다."},"duration":{"ru":"От полутора до трёх часов без долгого обеда и посещения всех аттракционов.","ko":"긴 식사나 여러 놀이시설 이용을 제외하고 약 1시간 30분에서 3시간을 생각할 수 있습니다."},"access":{"ru":"Ветер и технические работы могут влиять на подъём. По вторникам канатная дорога открывается позже.","ko":"바람이나 정비로 운행이 달라질 수 있습니다. 화요일에는 케이블카가 늦게 시작합니다."},"gaps":{"ru":"Не подтверждены отдельные условия посещения. Ниже сохранены ссылки на использованные источники; неизвестные часы и тарифы не выдаются за действующие.","ko":"일부 방문 조건은 아직 확인되지 않았습니다. 검토에 사용한 출처를 아래에 남겼으며 미확인 운영 시간과 요금은 확정 정보로 제시하지 않습니다."}},"mapUrl":"https://www.google.com/maps/search/?api=1&query=%D0%9A%D0%B0%D0%BD%D0%B0%D1%82%D0%BD%D0%B0%D1%8F%20%D0%B4%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%9A%D0%BE%D0%BA-%D0%A2%D0%BE%D0%B1%D0%B5%2C%20%D0%94%D0%BE%D1%81%D1%82%D1%8B%D0%BA%20104%D0%91%2C%20%D0%90%D0%BB%D0%BC%D0%B0%D1%82%D1%8B","card":{"ru":"С Кок-Тобе можно рассмотреть Алматы с другой высоты. Наверху есть место для прогулки и остановки у панорамы. Это вариант для смены городского ритма без полноценного горного похода.","ko":"콕토베에서는 알마티를 높은 곳에서 바라볼 수 있습니다. 산책과 전망을 중심으로 방문하기 좋아 본격적인 등산 없이도 도심 여행에 다른 풍경을 더할 수 있습니다."}}},"plans":{"route-3d":{"stops":[{"placeId":"almaty-shymbulak","label":{"ru":"Нижняя станция «Медеу»","ko":"아래쪽 메데우 승강장"},"period":{"ru":"Утро: начало подъёма","ko":"오전, 첫 케이블카"},"time":{"ru":"Оставьте запас на дорогу и очередь","ko":"이동과 대기에 여유 두기"},"note":{"ru":"Приезжайте к базовой станции канатной дороги «Медеу». Отсюда первая линия ведёт к Шымбулаку. Станция и каток Медеу являются разными объектами. Каток реконструируется, поэтому катание и вход внутрь комплекса в этот день не входят.","ko":"케이블카 출발점인 메데우 베이스 승강장으로 이동합니다. 첫 구간은 이곳에서 심불라크 리조트로 이어집니다. 케이블카 승강장과 메데우 스케이트장은 다른 시설입니다. 스케이트장은 재건축 중이므로 스케이트나 내부 방문은 일정에 넣지 않습니다."},"next":{"ru":"Для полного подъёма нужен прогулочный Shymbulak Ticket в оба направления. Билет в одну сторону между Медеу и курортом не заменяет весь маршрут.","ko":"전체 코스에는 관광용 Shymbulak Ticket 왕복권이 필요합니다. 메데우와 리조트 사이의 편도권은 전체 일정의 왕복권을 대신하지 않습니다."}},{"placeId":"almaty-shymbulak","label":{"ru":"Базовая станция «Шымбулак»","ko":"심불라크 리조트 베이스"},"period":{"ru":"Прогулка и передышка","ko":"리조트 산책과 휴식"},"time":{"ru":"Около часа или полутора с паузами","ko":"휴식 포함 약 1시간~1시간 30분"},"note":{"ru":"После первой линии прогуляйтесь по доступной территории у базовой станции. Можно остаться на этом уровне, сделать фотографии и спокойно поесть. Подъём выше не обязателен, даже если у вас билет на все участки.","ko":"첫 구간에서 내린 뒤 베이스 승강장 주변의 개방된 공간을 둘러보세요. 이 높이에 머물며 사진을 찍고 식사해도 충분합니다. 전 구간 티켓이 있어도 반드시 더 올라갈 필요는 없습니다."},"next":{"ru":"Если погода позволяет и хочется продолжить, переходите на Комби-1. На следующей станции нужна ещё одна пересадка на Комби-2.","ko":"날씨가 괜찮고 더 올라가고 싶다면 콤비 1을 이용합니다. 다음 승강장에서 콤비 2로 한 번 더 갈아탑니다."}},{"placeId":"almaty-shymbulak","label":{"ru":"Комби-1, Комби-2 и Талгарский перевал","ko":"콤비 1·2와 탈가르 고개"},"period":{"ru":"Верхняя часть по желанию","ko":"선택하는 상부 구간"},"time":{"ru":"Короткая остановка у верхней станции","ko":"상부 승강장 주변에서 잠시 머물기"},"note":{"ru":"Комби-2 поднимает к Талгарскому перевалу примерно на 3200 метров. Это верхняя зона канатного маршрута, а не вершина горы. Здесь достаточно задержаться у панорамы в пределах открытой территории. Дальние тропы, восхождение и прогулку по лыжным трассам в этот план не добавляем.","ko":"콤비 2를 타면 약 3,200m의 탈가르 고개에 닿습니다. 케이블카 코스의 상부 구간이며 산 정상에 오르는 등반은 아닙니다. 개방된 승강장 주변에서 전망을 감상하는 일정입니다. 먼 탐방로나 정상 등반, 스키 슬로프 보행은 포함하지 않습니다."},"next":{"ru":"Спускайтесь в обратной последовательности: Комби-2, Комби-1, затем линия до Медеу. На каждую пересадку и очередь нужен запас.","ko":"하산은 콤비 2, 콤비 1, 메데우행 구간의 역순입니다. 구간마다 갈아타는 시간과 대기 시간을 남겨 두세요."}}],"conditions":[{"title":{"ru":"Билет на три участка и спуск","ko":"세 구간과 하산을 포함한 티켓"},"body":{"ru":"Shymbulak Ticket в оба направления включает путь от Медеу до Комби-2 и обратно. С 15 лет билет стоит 12 000 ₸, для детей от 6 до 14 лет 4 000 ₸. Открытая кресельная ККД-4 в этот билет не входит. Лыжный ски-пасс для этой прогулки не нужен. Оплата корейской картой и покупка без местного номера не проверены.","ko":"Shymbulak Ticket 왕복권은 메데우에서 콤비 2까지 오가는 구간을 포함합니다. 15세부터는 12,000텡게, 6~14세는 4,000텡게입니다. 개방형 체어리프트 KKD-4는 포함되지 않습니다. 이 관광 일정에는 스키 패스가 필요하지 않습니다. 한국 발급 카드 결제와 현지 전화번호 없이 구매하는 과정은 확인되지 않았습니다."}},{"title":{"ru":"Когда начинать спуск","ko":"하산 시간을 잡는 법"},"body":{"ru":"В обычном опубликованном графике Медеу работает с 09:00 до 18:00, Комби-1 до 17:00, Комби-2 до 16:30. Посадку прекращают за полчаса до закрытия. Это режим линий, а не обещание последнего спуска для вашего билета. Если поднялись до перевала, около 15:00 стоит уже направляться вниз. Это наш запас для планирования, не официальный последний рейс. Во время профилактики обычный график не действует.","ko":"공개된 일반 운행표는 메데우 구간 09:00~18:00, 콤비 1은 17:00까지, 콤비 2는 16:30까지입니다. 탑승 접수는 마감 30분 전에 끝납니다. 이 시간표가 이용 티켓의 마지막 하산을 보장하는 것은 아닙니다. 탈가르 고개까지 갔다면 15:00 무렵에는 하산을 시작하는 편으로 계획하세요. 여유를 둔 일정 기준이며 공식 막차 시각은 아닙니다. 정비 기간에는 일반 시간표를 적용할 수 없습니다."}},{"title":{"ru":"Погода и короткий вариант","ko":"날씨에 맞춘 짧은 일정"},"body":{"ru":"Возьмите тёплый слой одежды, защиту от ветра и обувь с нескользкой подошвой. На верхних станциях условия отличаются от центра Алматы. Если видимость плохая или наверху некомфортно, остановитесь на уровне курорта либо перенесите горный день. Закрытую канатную линию не заменяем самостоятельным походом вдоль дороги.","ko":"따뜻한 겉옷과 바람을 막을 옷, 미끄럼이 적은 신발을 준비하세요. 상부 승강장의 환경은 알마티 도심과 다릅니다. 시야가 좋지 않거나 높은 곳이 불편하다면 리조트에서 머물거나 산악 일정을 다른 날로 옮길 수 있습니다. 케이블카가 닫혔다고 도로를 따라 직접 걸어 올라가는 코스로 바꾸지는 않습니다."}}]},"route-3d-charyn":{"stops":[{"placeId":"almaty-charyn","label":{"ru":"Визит-центр и верхняя часть","ko":"방문자 센터와 상부 전망"},"period":{"ru":"Знакомство с каньоном","ko":"협곡을 처음 만나는 곳"},"time":{"ru":"Пауза перед спуском","ko":"내려가기 전 잠시 쉬기"},"note":{"ru":"Начните с доступной обзорной зоны у визит-центра. Посмотрите на каньон сверху, воспользуйтесь туалетом и подготовьте воду до выхода на тропу. Машина остаётся наверху. Спуск на частном автомобиле в каньон запрещён.","ko":"방문자 센터 주변의 개방된 전망 구역에서 협곡을 먼저 바라봅니다. 탐방로에 들어가기 전에 화장실을 이용하고 물을 준비하세요. 차량은 위에 두며 개인 차량으로 협곡 아래까지 내려갈 수는 없습니다."},"next":{"ru":"Если лестница и обратный подъём вам не подходят, выбирайте короткий осмотр сверху в пределах открытых площадок. Безбарьерность всей верхней зоны не подтверждена.","ko":"계단과 복귀 오르막이 부담스럽다면 개방된 상부 전망 구역만 짧게 둘러보는 쪽을 선택합니다. 상부 구역 전체가 무장애 동선인지는 확인되지 않았습니다."}},{"placeId":"almaty-charyn","label":{"ru":"Долина замков","ko":"성의 계곡"},"period":{"ru":"Главная прогулка","ko":"바위 사이를 걷는 시간"},"time":{"ru":"До реки или с разворотом раньше","ko":"강까지 걷거나 중간에서 돌아오기"},"note":{"ru":"Спуститесь по лестнице и идите по обозначенному пути между скальными стенами. Башни интереснее рассматривать без спешки. Не обязательно доходить до реки: можно развернуться раньше, сохранив силы на подъём.","ko":"계단을 내려간 뒤 바위 사이의 지정된 길을 따라 걷습니다. 탑처럼 솟은 암벽은 서두르지 않고 볼 때 더 잘 눈에 들어옵니다. 강까지 도착해야만 하는 코스는 아닙니다. 오르막에 쓸 힘을 남기고 중간에서 돌아와도 좋습니다."},"next":{"ru":"У реки сделайте остановку в разрешённом месте. Купание в этот план не входит. Не выходите за ограждения и не забирайтесь на скалы ради снимка.","ko":"강가에서는 허용된 장소에서만 쉬어 갑니다. 수영은 이 일정에 넣지 않습니다. 사진을 위해 울타리 밖으로 나가거나 바위에 올라가지 마세요."}},{"placeId":"almaty-charyn","label":{"ru":"Подъём и возвращение к машине","ko":"계단을 올라 차량으로 복귀"},"period":{"ru":"Завершение прогулки","ko":"산책을 마무리하는 길"},"time":{"ru":"С запасом на отдых и лестницу","ko":"휴식과 오르막에 여유 두기"},"note":{"ru":"Вернитесь тем же разрешённым путём и поднимитесь к верхней зоне. Не оставляйте лестницу на последние минуты перед выездом. Услуги внутреннего подвоза не включены в план, поэтому рассчитывайте пройти обратный путь самостоятельно.","ko":"허용된 같은 길로 돌아와 계단을 올라갑니다. 차량 출발 직전에 계단 구간을 남기지 않도록 하세요. 협곡 내부 이동 차량은 이 일정에 포함하지 않으므로 돌아오는 길도 직접 걸을 수 있는 범위로 계획합니다."},"next":{"ru":"После отдыха возвращайтесь к машине и в Алматы. Дополнительные каньоны и озёра в этот день не обязательны.","ko":"충분히 쉰 뒤 차량을 만나 알마티로 돌아갑니다. 다른 협곡이나 호수를 이날 더 방문할 필요는 없습니다."}}],"conditions":[{"title":{"ru":"Погода и время года","ko":"계절과 날씨"},"body":{"ru":"Для долгой прогулки удобнее весна и осень без сильных осадков. Летом открытая тропа бывает жаркой, поэтому прохладную часть дня оставляйте для пешего пути. Зимой снег и лёд могут сделать лестницу неудобной. При ливне, грозе или ограничениях парка спуск отменяется. Круглогодичный маршрут не означает доступ в любую погоду.","ko":"오래 걷기에는 큰비가 없는 봄과 가을이 비교적 좋습니다. 여름에는 노출된 탐방로가 더우므로 걷는 시간을 서늘한 때에 배치합니다. 겨울에는 눈과 얼음으로 계단 이용이 어려울 수 있습니다. 폭우나 뇌우, 공원의 출입 제한이 있을 때는 내려가지 않습니다. 연중 운영하는 탐방로라도 모든 날씨에 이용할 수 있다는 뜻은 아닙니다."}},{"title":{"ru":"Что взять на прогулку","ko":"산책 준비"},"body":{"ru":"Возьмите воду на весь пеший путь, головной убор, защиту от солнца и обувь с нескользкой подошвой. В прохладный сезон добавьте слой от ветра. Сохраните план и место встречи без интернета. Идите только по обозначенной тропе, не подходите к краю обрыва и не рассчитывайте на речную воду как на питьевую.","ko":"왕복 산책 동안 마실 물과 모자, 자외선 차단 용품, 미끄럼이 적은 신발을 준비합니다. 서늘한 계절에는 바람을 막을 옷도 챙기세요. 일정과 만날 장소는 오프라인으로 저장합니다. 지정된 탐방로를 따르고 절벽 끝에 다가가지 않으며 강물을 식수로 사용하지 않습니다."}},{"title":{"ru":"Что должно входить в стоимость","ko":"비용에 포함될 항목"},"body":{"ru":"Разделяйте машину с водителем, ожидание, обратную поездку, вход в парк и питание. Входной билет не означает, что трансфер или услуги внутри каньона уже оплачены. Точная сумма сбора для этого визита и оплата корейской картой пока не подтверждены. Kaspi не считаем доступным способом оплаты для иностранного гостя по умолчанию.","ko":"차량과 운전기사, 현장 대기, 알마티 복귀, 공원 입장료, 식비를 구분해서 봅니다. 입장권이 차량 이동이나 협곡 내 서비스를 포함하는 것은 아닙니다. 이 방문에 적용될 정확한 입장료와 한국 발급 카드 결제는 아직 확인되지 않았습니다. 외국인 방문자가 Kaspi를 사용할 수 있다고 전제하지 않습니다."}},{"title":{"ru":"Язык и сопровождение","ko":"언어와 동행"},"body":{"ru":"Пейзажи можно смотреть без экскурсионного рассказа. Но поездка должна иметь понятные условия встречи и возвращения. Корейский гид и инструктаж здесь не подтверждены. Русская переписка или английская страница тура сами по себе не решают языковой барьер, поэтому непроверенного перевозчика не выдаём за готовую рекомендацию.","ko":"풍경 감상에 반드시 해설이 필요한 것은 아닙니다. 다만 차량을 만날 장소와 귀환 조건은 이해할 수 있어야 합니다. 한국어 가이드와 안전 설명은 확인되지 않았습니다. 러시아어 연락이나 영어로 된 투어 소개만으로 언어 문제가 해결되는 것은 아니므로 검증하지 않은 운송편을 바로 이용할 수 있는 추천으로 제시하지 않습니다."}}]},"route-3d-kolsai":{"stops":[{"placeId":"almaty-kolsai","label":{"ru":"Нижнее Кольсайское озеро","ko":"하부 콜사이 호수"},"period":{"ru":"Вариант 1: вода и хвойные склоны","ko":"선택 1, 호수와 침엽수 숲"},"time":{"ru":"Около двух или трёх часов у озера с отдыхом","ko":"현장 휴식 포함 약 2~3시간"},"note":{"ru":"Начните с открытой обзорной зоны у Нижнего озера и пройдите доступную часть берега. Не нужно обходить озеро целиком ради полноценного впечатления. Можно задержаться у понравившегося вида и вернуться тем же разрешённым путём.","ko":"하부 호수의 개방된 전망 구역에서 시작해 이용 가능한 호숫길을 걷습니다. 호수 전체를 돌아야만 제대로 본 것은 아닙니다. 마음에 드는 풍경 앞에서 쉬었다가 허용된 같은 길로 돌아와도 좋습니다."},"next":{"ru":"Поход к Среднему и Верхнему Кольсаю в этот вариант не входит. Если береговая тропа мокрая или скользкая, сокращайте прогулку.","ko":"중부와 상부 콜사이로 가는 산행은 이 선택지에 포함하지 않습니다. 호숫길이 젖었거나 미끄럽다면 걷는 구간을 줄입니다."}},{"placeId":"almaty-kaindy","label":{"ru":"Озеро Каинды","ko":"카인디 호수"},"period":{"ru":"Вариант 2: ели в воде","ko":"선택 2, 물속에 남은 가문비나무"},"time":{"ru":"Около двух или трёх часов на подход, осмотр и возврат","ko":"접근과 관람, 차량 복귀에 약 2~3시간"},"note":{"ru":"После высадки идите к открытым для посетителей точкам осмотра. Главное здесь видно с берега: стройные стволы поднимаются из воды на фоне горного леса. Нужны обувь для неровной тропы и силы на возвращение к машине.","ko":"차에서 내린 뒤 방문자에게 개방된 관람 지점으로 걸어갑니다. 물 위로 곧게 남은 나무줄기와 뒤쪽 산림이 이루는 풍경은 물가에서 볼 수 있습니다. 고르지 않은 길에 맞는 신발과 차량까지 돌아올 체력을 생각해야 합니다."},"next":{"ru":"Путь от машины не выдаём за ровную дорожку без подъёмов. Точный пеший километраж зависит от места высадки, оно пока не зафиксировано.","ko":"하차 후의 길을 오르막 없는 평탄한 산책로로 보지는 않습니다. 정확한 도보 거리는 하차 지점에 따라 달라지며 그 지점은 아직 정해져 있지 않습니다."}}],"conditions":[{"title":{"ru":"Если хочется увидеть оба озера","ko":"두 호수를 함께 보고 싶다면"},"body":{"ru":"Один из спокойных вариантов предполагает Нижний Кольсай в первый день, ночь в Саты и Каинды на следующий день с возвращением в Алматы. Так нет необходимости повторять длинную дорогу из города дважды. Это схема для планирования, не расписание готового тура. Доступ к Каинды, продолжительность последних участков и обратный выезд должны укладываться в программу. При плохих условиях выбирайте одно озеро, а не добавляйте второе любой ценой.","ko":"하루는 하부 콜사이, 사티에서 숙박한 뒤 다음 날 카인디를 보고 알마티로 돌아오는 구성을 생각할 수 있습니다. 도시에서 긴 길을 두 번 왕복하지 않아도 된다는 장점이 있습니다. 다만 완성된 투어 시간표가 아닌 일정 구상입니다. 카인디 진입과 마지막 이동 구간, 알마티 복귀까지 가능한 구성이어야 합니다. 여건이 좋지 않으면 두 곳을 무리하게 채우기보다 한 호수를 선택하세요."}},{"title":{"ru":"Дорога к Каинды после ремонта","ko":"도로 보수 이후의 카인디 진입"},"body":{"ru":"К Каинды открыли отремонтированную асфальтированную дорогу. Это не подтверждение одинакового покрытия на всём пути или подъезда к воде без пешего участка. Поэтому не обещаем ни обязательный УАЗ, ни свободный проезд любой легковой машины. Последняя высадка и необходимость пересадки зависят от конкретной поездки и действующих ограничений.","ko":"카인디로 향하는 보수된 아스팔트 도로가 개방되었습니다. 전 구간의 노면이 같거나 도보 없이 물가까지 갈 수 있다는 의미는 아닙니다. 따라서 반드시 UAZ를 타야 한다거나 모든 승용차가 통행할 수 있다고 단정하지 않습니다. 마지막 하차 지점과 환승 여부는 실제 이동 구성과 출입 제한에 따라 달라집니다."}},{"title":{"ru":"Сезон и погода","ko":"계절과 날씨"},"body":{"ru":"Для первого визита проще выбирать период без снега и льда на пеших участках. У озёр пригодятся тёплый слой и защита от дождя даже в тёплое время. Зимой озёрный пейзаж меняется, а снег и лёд могут осложнять подход. Открытие дороги в одной новости не гарантирует доступ в день поездки. При ограничениях парка прогулку сокращают или отменяют, закрытые участки не обходят.","ko":"첫 방문은 도보 구간에 눈과 얼음이 없는 시기를 고르는 편이 수월합니다. 따뜻한 계절에도 호숫가에서는 보온용 겉옷과 비를 막을 옷이 유용합니다. 겨울에는 풍경뿐 아니라 눈과 얼음으로 접근 조건도 달라집니다. 도로 개방 공지가 방문일의 통행을 보장하지는 않습니다. 공원의 제한이 있으면 산책을 줄이거나 취소하고 폐쇄 구간을 우회해 들어가지 않습니다."}},{"title":{"ru":"Вход, расходы и язык","ko":"입장과 비용, 언어"},"body":{"ru":"Сбор парка, въезд и стоянка машины, трансфер, ночёвка и питание являются разными расходами. Точная сумма для вашего состава поездки и оплата корейской картой не подтверждены. Билет на один визит не считаем автоматически действующим на другое озеро или следующий день. Kaspi не является обязательным доступным способом оплаты для иностранца.","ko":"공원 이용료와 차량 진입 및 주차, 이동, 숙박, 식비는 구분해야 합니다. 선택한 방문 구성의 정확한 총액과 한국 발급 카드 결제는 확인되지 않았습니다. 한 번의 방문권이 다른 호수나 다음 날에도 자동으로 유효하다고 보지 않습니다. 외국인 여행자가 Kaspi를 사용할 수 있다고 전제하지 않습니다."}},{"title":{"ru":"Прогулка без обязательных активностей","ko":"선택 활동 없이 풍경 즐기기"},"body":{"ru":"Чтобы увидеть озёра, не обязательно садиться на лошадь или лодку. В базовом плане остаются виды с разрешённых точек и пешая прогулка по силам. Купание запрещено. Корейский гид и понятный корейскому гостю инструктаж для дополнительных активностей не подтверждены.","ko":"호수를 보기 위해 반드시 말을 타거나 보트를 이용할 필요는 없습니다. 기본 방문은 허용된 지점의 전망과 체력에 맞는 산책입니다. 수영은 금지되어 있습니다. 추가 활동의 한국어 가이드나 한국인 여행자가 이해할 수 있는 안전 설명은 확인되지 않았습니다."}}]}}}</script><script id="product-runtime">function createTripView(data,{state,t,tr,esc,link,maps}){
const fields=[['lodging','shared',()=>t('Жильё за всю поездку','전체 숙박비')],['local','shared',()=>t('Городские такси и аэропорт','시내와 공항 차량 전체')],['outskirts','shared',()=>t('Весь загородный транспорт','외곽 차량 전체')],['meals','person',()=>t('Питание на одного за поездку','여행 중 1인 식비')],['tickets','person',()=>t('Все билеты и сборы на одного','1인 입장권과 각종 요금')],['other','shared',()=>t('Связь, страховка и прочие расходы','통신과 보험, 그 밖의 비용')]];
const entered=id=>state.expenses[id]!==''&&state.expenses[id]!=null&&Number.isFinite(Number(state.expenses[id]))&&Number(state.expenses[id])>=0;
const money=n=>new Intl.NumberFormat(state.lang==='ko'?'ko-KR':'ru-RU',{maximumFractionDigits:2}).format(n)+' KZT';
function expenseHint(id){return {
 lodging:state.tripMode==='lakes'?t('Четыре ночи в Алматы, одна в Саты и ещё одна в Алматы. Сохранённый городской номер на время Саты оплачивается дополнительно.','알마티 4박, 사티 1박, 알마티 1박입니다. 사티 숙박 중에도 도심 객실을 유지하면 추가 비용이 듭니다.'):t('Шесть ночей в своём жилье. Раннее заселение и дополнительные ночи учитывайте по своему бронированию.','선택한 숙소에서 6박입니다. 이른 입실과 추가 숙박은 본인 예약에 따라 더하세요.'),
 local:t('Дорога из аэропорта и обратно, а также городские переезды за все дни. Сумма на всю компанию.','공항 왕복과 여행 기간의 시내 이동을 모두 포함한 일행 전체 금액입니다.'),
 outskirts:state.tripMode==='local'?t('В этом варианте дальних выездов нет. Введите 0, если загородных расходов не будет. Старые суммы не удаляются при смене программы.','이 일정에는 장거리 이동이 없습니다. 외곽 지출이 없다면 0을 입력하세요. 일정을 바꾸어도 기존 금액은 지워지지 않습니다.'):state.tripMode==='lakes'?t('Вся дорога Алматы → Саты → оба озера → Алматы, ожидание и подходящий подъезд к Каинды. Уже включённые ночёвку и еду второй раз не считайте.','알마티, 사티, 두 호수, 알마티 귀환 전 구간과 대기, 카인디 접근 차량을 포함합니다. 숙박이나 식사가 이미 포함되어 있다면 중복 계산하지 마세요.'):t('Машина к Чарыну с ожиданием и возвращением. Если сборы и еда входят в общую цену, не добавляйте их повторно.','차른 왕복 차량과 대기 비용입니다. 입장료나 식사가 포함된 요금이라면 다른 항목에 다시 더하지 마세요.'),
 meals:t('За все дни, включая прилёт и вылет. Питание, включённое в жильё или выезд, повторно не добавляйте.','도착일과 출국일을 포함한 식비입니다. 숙박이나 외곽 서비스에 포함된 식사는 다시 더하지 마세요.'),
 tickets:t('Используйте ориентир билетов выше и добавьте остальные сборы выбранного варианта. Это одна сумма на взрослого.','위 입장권 참고 금액에 선택한 일정의 나머지 입장료를 더합니다. 성인 1인 기준 금액입니다.'),
 other:t('Связь и страховка всех участников, а также другие известные расходы. Покупки и личный запас денег определяйте отдельно.','일행 모두의 통신과 보험, 그 밖에 예상되는 비용을 합산하세요. 쇼핑과 개인 여유 자금은 별도로 생각해 두세요.')
 }[id]}
function budgetSummary(){let shared=0,person=0;for(const [id,scope]of fields)if(entered(id)){if(scope==='shared')shared+=Number(state.expenses[id]);else person+=Number(state.expenses[id])}const missing=fields.filter(([id])=>!entered(id));if(missing.length===fields.length)return `<p data-budget-missing>${t('Расходы ещё не внесены. Пока неизвестны суммы, итог на компанию и на взрослого не рассчитан.','아직 지출을 입력하지 않았습니다. 금액이 정해지면 일행 전체와 성인 1인 금액을 계산할 수 있습니다.')}</p>`;return `<p data-budget-breakdown>${t('Учтённые общие расходы','입력한 공동 비용')}: ${esc(money(shared))}<br>${t('Учтённые расходы на каждого взрослого','입력한 성인 1인 비용')}: ${esc(money(person))}</p><p data-budget-average>${t('По внесённым суммам на взрослого при равном разделении','입력값을 성인끼리 균등하게 나눈 1인 금액')}: <strong>${esc(money(shared/state.people+person))}</strong></p><p data-budget-missing>${missing.length?t('Ещё не учтено: ','아직 입력하지 않은 항목: ')+esc(missing.map(([, ,label])=>label()).join(', ')):t('Все шесть статей заполнены. Проверьте, что включено в каждую сумму: заполнение полей не подтверждает итоговую стоимость поездки.','여섯 항목을 모두 입력했습니다. 각 금액의 포함 내역을 살펴보세요. 입력을 마쳤다고 실제 총여행비가 확정되는 것은 아닙니다.')}</p>`}
function productOverview(){return `<details data-product-overview><summary>${t('Как устроена эта поездка','이 여행 안내의 구성')}</summary><div><p>${t('Этот план подходит для самостоятельной поездки: вы выбираете своё жильё, едите там, где понравится, и двигаетесь в удобном темпе. Первое знакомство с центром проходит пешком, другие городские переезды можно делать на такси.','숙소와 식당을 직접 고르고 본인에게 맞는 속도로 여행하는 분을 위한 안내입니다. 첫 도심 일정은 걸어서 둘러보고, 다른 시내 구간은 택시로 이동할 수 있습니다.')}</p><p>${t('Внутри собраны пять полных дней, отдельные прилёт и вылет, ночёвки, начало и возвращение каждого дня. Можно сохранить выбранный вариант на телефон и пользоваться текстом без сети. Для карт и внешних сайтов нужен интернет.','온전한 다섯 날과 별도의 도착일, 출국일, 숙박 구성, 매일의 출발과 귀환을 함께 정리했습니다. 선택한 일정을 휴대전화에 저장하면 안내문은 오프라인으로 볼 수 있습니다. 지도와 외부 사이트에는 인터넷이 필요합니다.')}</p><p>${t('Жильё, еду, билеты и транспорт вы оплачиваете отдельно. Путеводитель не бронирует услуги и не включает личное сопровождение.','숙박과 식사, 입장권, 교통비는 별도입니다. 이 안내는 서비스 예약이나 개인 동행을 제공하지 않습니다.')}</p></div></details>`}
function modeGuide(){return `<section class="card" data-mode-guide><h3>${t('Какой вариант выбрать','어떤 일정을 고를까요?')}</h3><dl><dt>${t('Без дальних выездов','장거리 이동 없이')}</dt><dd>${t('Если хочется жить в одном месте, знакомиться с городом и не готовить отдельную загородную машину. Горный день всё равно зависит от погоды и работы канатных дорог.','한 숙소에 머물며 도심을 둘러보고 외곽 차량을 따로 준비하지 않고 싶을 때 맞습니다. 산악 일정은 날씨와 케이블카 운행에 영향을 받습니다.')}</dd><dt>${t('Город и Чарын','도심과 차른')}</dt><dd>${t('Если готовы посвятить каньону целый день в дороге и на природе. Нужна отдельно подготовленная машина туда и обратно. Все ночи остаются в Алматы.','이동과 자연 관람에 하루를 온전히 쓰고 싶을 때 선택하세요. 별도로 준비한 왕복 차량이 필요하며 모든 밤은 알마티에서 보냅니다.')}</dd><dt>${t('Два дня у озёр','호수에서 이틀')}</dt><dd>${t('Если готовы сменить жильё на одну ночь ради Кольсая и Каинды. Нужны ночёвка в Саты и весь транспорт до возвращения в Алматы. Чарын к этим двум дням не добавляем.','콜사이와 카인디를 위해 하룻밤 숙소를 옮길 수 있을 때 맞습니다. 사티 숙박과 알마티 귀환까지의 모든 이동이 필요합니다. 이틀 일정에 차른은 추가하지 않습니다.')}</dd></dl></section>`}
function dateFor(n){if(!state.firstDate)return null;const d=new Date(state.firstDate+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n-1);return d}
function dateLabel(n){const d=dateFor(n);return d?new Intl.DateTimeFormat(state.lang==='ko'?'ko-KR':'ru-RU',{day:'numeric',month:'short',weekday:'short',timeZone:'UTC'}).format(d):''}
function mountainOrder(){return `<div data-mountain-order><p class="small">${t('Городской день и горы можно поменять местами. Это поможет оставить горы на подходящую погоду без повторного посещения музея или торгового центра.','도심 일정과 산악 일정의 순서를 바꿀 수 있습니다. 미술관이나 쇼핑몰을 다시 방문하지 않고 날씨에 맞는 날을 산에 배정해 보세요.')}</p><div class="segments" role="group" aria-label="${t('Порядок городского и горного дня','도심과 산악 일정 순서')}"><button data-choice="mountainOrder" data-value="second" aria-pressed="${state.mountainOrder!=='third'}">${t('Горы во второй день','산은 2일차')}</button><button data-choice="mountainOrder" data-value="third" aria-pressed="${state.mountainOrder==='third'}">${t('Горы в третий день','산은 3일차')}</button></div><p class="note">${t('Меняются два дня программы и применимые выходные музея. Погода и работа линий автоматически не проверяются, купленные билеты не переносятся. Если горы недоступны оба дня, оставьте второй день для отдыха или короткой прогулки рядом с жильём.','두 날의 일정과 미술관 휴관일 적용이 함께 바뀝니다. 날씨와 운행 여부를 자동 확인하거나 구매한 입장권을 변경하지는 않습니다. 두 날 모두 산에 갈 수 없다면 2일차는 숙소 근처에서 쉬거나 가볍게 걸어도 좋습니다.')}</p></div>`}
function selectedDays(){const common=data.journey.common;if(state.mountainOrder!=='third')return [...common,...data.journey[state.tripMode]];return [common[0],{...common[2],n:2,body:{ru:'Выберите искусство или покупки, затем оставьте свободное время на еду и отдых. Горный день перенесён на завтра.',ko:'미술관이나 쇼핑을 선택하고 식사와 휴식 시간을 남깁니다. 산악 일정은 내일로 옮겼습니다.'},return:{ru:'После осмотра и еды вернитесь в своё жильё. Завтра горный день, поэтому вечер можно оставить свободным.',ko:'관람과 식사 뒤 숙소로 돌아갑니다. 내일 산에 갈 예정이므로 저녁은 여유롭게 보내세요.'}},{...common[1],n:3},...data.journey[state.tripMode]]}
function mountainAlerts(){const visit=dateFor(state.mountainOrder==='third'?3:2);if(!visit)return [];const day=visit.toISOString().slice(0,10);const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Almaty',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return data.mountainAlerts.filter(a=>a.from<=day&&day<=a.to&&today<=a.to)}
function total(){let sum=0,filled=0;for(const [id,scope]of fields){const raw=state.expenses[id];if(raw!==''&&raw!=null&&Number.isFinite(Number(raw))&&Number(raw)>=0){sum+=Number(raw)*(scope==='person'?state.people:1);filled++}}return filled?`${new Intl.NumberFormat(state.lang==='ko'?'ko-KR':'ru-RU').format(sum)} KZT · ${filled}/${fields.length} ${t('статей заполнено','항목 입력')}${filled<fields.length?' · '+t('это часть расходов','일부 지출만 계산'):''}`:t('Суммы пока не внесены','아직 금액을 입력하지 않았습니다')}
function planDetails(day){const p=data.plans[day.routeId];if(!p)return '';const stops=p.stops.filter(s=>!day.stopId||s.placeId===day.stopId);return `<details data-full-day><summary>${t('Остановки и условия подробно','방문 순서와 조건 자세히')}</summary><div>${stops.map(s=>`<h3>${esc(tr(s.label||data.names[s.placeId]))}</h3><p class="small muted">${esc(tr(s.time))}</p><p>${esc(tr(s.note))}</p>${day.stopId?'':`<p>${esc(tr(s.next))}</p>`}`).join('')}${p.conditions.map(c=>`<details><summary>${esc(tr(c.title))}</summary><div><p>${esc(tr(c.body))}</p></div></details>`).join('')}</div></details>`}
function museumBlocked(){const d=dateFor(state.mountainOrder==='third'?2:3);return !!d&&(d.getUTCDay()===1||new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()===d.getUTCDate())}
function ticketReference(){const r=data.journey.ticketReference,items=[{label:t('Шымбулак, прогулочный билет туда и обратно','심불라크 관광 케이블카 왕복'),amount:r.shymbulak}];if(state.tripMode!=='lakes')items.push({label:t('Кок-Тобе, канатная дорога туда и обратно','콕토베 케이블카 왕복'),amount:r.koktobe});if(!museumBlocked()&&state.culture==='museum')items.push({label:t('Музей Кастеева, взрослый иностранный посетитель','카스테예프 미술관 외국인 성인'),amount:r.museum});const sum=items.reduce((a,i)=>a+i.amount,0),money=n=>new Intl.NumberFormat(state.lang==='ko'?'ko-KR':'ru-RU').format(n)+' KZT';return `<section class="card" data-ticket-reference><h3>${t('На какие билеты заложить деньги','입장권에 필요한 비용')}</h3><p class="note">${t('Ориентир на одного взрослого для выбранной программы, при работе канатных дорог. Детские и льготные тарифы считаются отдельно.','선택한 일정에서 케이블카가 운행할 때의 성인 1인 기준입니다. 아동과 할인 요금은 별도로 계산하세요.')}</p><ul>${items.map(i=>`<li>${esc(i.label)}: <strong>${esc(money(i.amount))}</strong></li>`).join('')}</ul><p data-ticket-subtotal>${t('За перечисленные посещения','위 항목 합계')}: <strong>${esc(money(sum))}</strong></p><p class="note">${t('Это часть затрат. Жильё, еда, такси, загородная машина, сборы у озёр и каньона сюда не входят. Цены могут меняться. Если услуга уже включена в вашу поездку, не считайте её второй раз. Суммы ниже остаются вашими и не меняются автоматически.','전체 여행비가 아닌 일부 비용입니다. 숙박과 식사, 택시, 외곽 차량, 호수와 협곡의 입장료는 포함하지 않습니다. 요금은 달라질 수 있습니다. 선택한 서비스에 이미 포함된 항목은 중복 계산하지 마세요. 아래에 입력한 금액은 자동으로 바뀌지 않습니다.')}</p></section>`}
function outskirtsPreparation(){if(state.tripMode==='local')return '';return `<details data-outskirts-preparation><summary>${t('Перед загородной частью','외곽 일정 출발 전')}</summary><div><p>${t('Это дополнительный вариант самостоятельной поездки. Перевозку вы выбираете и оплачиваете отдельно. Перед выездом предусмотрите следующее.','직접 준비해서 떠나는 추가 일정입니다. 차량은 별도로 선택하고 결제합니다. 출발 전에 다음 내용을 준비하세요.')}</p><ul>${data.journey.outskirtsReady.slice(0,state.tripMode==='lakes'?4:3).map(v=>`<li>${esc(tr(v))}</li>`).join('')}</ul><p>${t('Если условия не сложились, можно провести оставшиеся дни в городе. Это меняет программу и схему ночёвок в путеводителе, но не отменяет ваши бронирования.','조건이 갖춰지지 않았다면 남은 날을 도심에서 보낼 수 있습니다. 아래 선택은 안내의 일정과 숙박 구성을 바꾸며 실제 예약을 취소하지는 않습니다.')}</p><button class="action no-print" data-choice="tripMode" data-value="local">${t('Выбрать дни без дальних выездов','장거리 이동 없는 일정 선택')}</button></div></details>`}
function cultureCard(){const d=dateFor(state.mountainOrder==='third'?2:3),blocked=!!d&&(d.getUTCDay()===1||new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()===d.getUTCDate()),which=blocked?'shopping':state.culture,p=data.places[which==='museum'?'almaty-kasteev-museum':'almaty-dostyk-plaza'];return `<div class="culture-choice">${blocked?`<p class="route-essential" data-museum-blocked>${t('На этот день приходится понедельник или последний день месяца. Вместо музея выбран Dostyk Plaza.','이날은 월요일 또는 매월 마지막 날입니다. 미술관 대신 Dostyk Plaza를 선택했습니다.')}</p>`:''}<div class="segments no-print" role="group" aria-label="${t('Выбор городского дня','도심 하루 선택')}"><button data-choice="culture" data-value="museum" aria-pressed="${which==='museum'}" ${blocked?'disabled':''}>${t('Искусство','미술관')}</button><button data-choice="culture" data-value="shopping" aria-pressed="${which==='shopping'}">${t('Покупки и еда','쇼핑과 식사')}</button></div><h3>${esc(tr(p.name))}</h3><p>${esc(tr(p.card))}</p><p class="small">${esc(tr(p.visitor.hours))}</p><p>${esc(tr(p.visitor.address))}</p><div class="actions">${link(p.mapUrl,t('Место на карте','장소 지도'))}</div><p class="note">${which==='museum'?t('На осмотр оставьте около двух часов. Для взрослого иностранного посетителя вход 5 000 KZT. Русскоязычная экскурсия не является частью этого дня.','관람에 약 두 시간을 남겨 두세요. 외국인 성인 입장료는 5,000 KZT입니다. 러시아어 해설 투어는 이 일정에 포함되지 않습니다.'):t('Покупки не обязательны. Можно оставить время на обед и отдых.','구매는 필수가 아닙니다. 식사하고 쉬어 가도 좋습니다.')}</p></div>`}

function nightPlan(){
 const lakes=state.tripMode==='lakes';
 const nights=Array.from({length:6},(_,i)=>{const date=dateLabel(i),saty=lakes&&i===4;return `<li data-night="${i}" data-night-city="${saty?'saty':'almaty'}"><span>${date?esc(date):i===0?t('После прилёта','도착 후'):t('После дня ','일정 ')+i+(state.lang==='ko'?' 후':'')}</span><strong>${saty?t('Саты','사티'):t('Алматы','알마티')}</strong></li>`}).join('');
 return `<section class="card night-plan" data-night-plan><h3>${t('Где вы спите каждую ночь','매일 밤 머무를 곳')}</h3><p data-night-total>${lakes?t('6 ночей: 5 в Алматы и 1 в Саты.','총 6박: 알마티 5박, 사티 1박.'):t('6 ночей в Алматы, без смены базы.','숙소를 옮기지 않고 알마티에서 6박.')}</p><ol class="night-grid">${nights}</ol><p>${lakes?t('В Алматы удобно разделить проживание на два бронирования: четыре ночи до озёр и одну после возвращения. Большой багаж можно оставить только там, где хранение между бронированиями входит в подтверждённые условия. Если сохраняете городской номер на время Саты, эта ночь тоже оплачивается.','알마티 숙박은 호수 방문 전 4박과 귀환 후 1박으로 나누어 예약할 수 있습니다. 두 예약 사이의 짐 보관은 숙소에서 확정된 조건에 포함된 경우에 이용하세요. 사티에 머무는 동안에도 알마티 객실을 유지한다면 그날 숙박비가 추가됩니다.'):t('Все ночи можно провести в одном жилье. Для утреннего доступа в номер или позднего ночного заселения бронирование должно соответствовать фактическому времени прибытия.','한 숙소에서 계속 머물 수 있습니다. 아침 입실이나 심야 체크인이 필요하다면 실제 도착 시간에 맞는 예약 조건이 필요합니다.')}</p><p class="note">${t('Это схема ночёвок для выбранных пяти полных дней, не бронирование. Утренний прилёт и ночной вылет могут изменить число оплачиваемых ночей.','선택한 다섯 날에 맞춘 숙박 구성 예시이며 예약 내역은 아닙니다. 아침 도착이나 심야 출국에 따라 결제할 숙박 일수는 달라질 수 있습니다.')}</p>${lakes?`<details data-saty-comfort><summary>${t('Комфортная ночёвка в Саты','사티에서 편안하게 묵기')}</summary><div><p>${t('После прогулки у озера приятно вернуться в тёплый номер, принять душ и спокойно поужинать. Для этого варианта выбирайте отдельный номер с собственной ванной комнатой, горячей водой и отоплением в холодное время. Общий санузел или неотапливаемый летний домик не соответствуют этой сборке.','호숫가 산책 뒤에는 따뜻한 방에서 샤워하고 저녁을 먹으며 쉬고 싶어집니다. 이 일정에는 전용 욕실과 온수가 있는 개별 객실, 추운 계절에는 난방을 갖춘 숙소가 어울립니다. 공용 욕실이나 난방 없는 여름용 숙소는 이 구성에 맞지 않습니다.')}</p><p>${t('Смотрите условия именно выбранного номера, а не только фотографии всего комплекса. Ужин, завтрак и время заселения должны быть понятны из условий бронирования. Ночёвка не включает автоматически перевозку к Каинды и возвращение в Алматы.','숙박 시설 전체 사진보다 선택한 객실의 조건을 살펴보세요. 저녁과 아침 식사, 입실 시간은 예약 조건에서 알 수 있어야 합니다. 숙박에 카인디 이동과 알마티 귀환이 자동으로 포함되는 것은 아닙니다.')}</p></div></details>`:''}</section>`
}
function render(all=false){const days=selectedDays();return `${productOverview()}${modeGuide()}<div class="trip-controls"><label class="date-label">${t('Дата первого полного дня, после ночи в Алматы','알마티에서 하룻밤 쉰 뒤 첫 일정 날짜')}<input type="date" data-first-date value="${esc(state.firstDate)}"></label><p class="note">${t('Дата нужна для выходных и распределения дней. Билеты и погоду календарь не проверяет.','휴관일과 날짜 배치를 위한 선택입니다. 입장권이나 날씨를 실시간 확인하지는 않습니다.')}</p><div class="segments" role="group" aria-label="${t('Вариант поездки','여행 방식')}">${Object.entries(data.journey.modes).map(([id,v])=>`<button data-choice="tripMode" data-value="${id}" aria-pressed="${state.tripMode===id}">${esc(tr(v.label))}</button>`).join('')}</div><p>${esc(tr(data.journey.modes[state.tripMode].note))}</p><div class="choice"><h3>${t('Прилёт и вылет отдельно','도착과 출국은 별도')}</h3><p>${t('Пример: прилёт, пять полных дней, затем вылет. После возвращения с озёр оставлена ночь в Алматы. Время рейса может потребовать дополнительной ночёвки.','도착 후 온전한 다섯 날을 보내고 출국하는 예시입니다. 호수에서 돌아온 날은 알마티에서 숙박합니다. 항공편 시간에 따라 추가 숙박이 필요할 수 있습니다.')}</p></div></div>${nightPlan()}${mountainOrder()}${outskirtsPreparation()}<div class="journey-days">${days.map(day=>`<article class="card journey-day" data-trip-day="${day.n}"><div class="eyebrow">${t('ДЕНЬ','일정')} ${day.n}${dateLabel(day.n)?' · '+esc(dateLabel(day.n)):''}</div><h3>${esc(tr(day.title))}</h3><p>${esc(tr(day.body))}</p>${day.routeId==='route-3d'?`<div class="choice mountain-closure" data-mountain-notice><p>${esc(tr(data.mountainTip))}</p>${mountainAlerts().map(a=>`<p data-dated-alert>${esc(tr(a.body))}</p>`).join('')}</div>`:''}${day.pending?`<p class="pending-note" data-trip-pending>${t('Дополнительный выезд. Отдельно подготовьте транспорт с ожиданием и возвращением'+(state.tripMode==='lakes'?', а также ночёвку в Саты.':'.'),'추가 외곽 일정입니다. 대기와 귀환을 포함한 차량'+(state.tripMode==='lakes'?'과 사티 숙박을 별도로 준비하세요.':'을 별도로 준비하세요.'))}</p>`:''}<dl class="mini-facts"><div><dt>${t('Темп','이동과 관람')}</dt><dd>${esc(tr(day.load))}</dd></div><div><dt>${t('Ночёвка и возвращение','숙박과 귀환')}</dt><dd>${esc(tr(day.back))}</dd></div></dl><div class="day-logistics" data-day-logistics><h4>${t('Начало дня','하루의 시작')}</h4><p>${esc(tr(day.start))}</p><h4>${t('Возвращение','귀환')}</h4><p>${esc(tr(day.return))}</p></div>${day.culture?cultureCard():''}${day.food?`<p><strong>${t('Еда и паузы.','식사와 휴식.')} </strong>${esc(tr(day.food))}</p>`:''}${day.alternative?`<details><summary>${t('Если день нужно изменить','일정을 바꾸어야 한다면')}</summary><div><p>${esc(tr(day.alternative))}</p></div></details>`:''}${day.n===5&&state.tripMode!=='lakes'?`<p class="small">${esc(tr(data.places['kok-tobe'].visitor.hours))}</p><p class="small">${t('Взрослый билет канатной дороги туда и обратно: 10 000 KZT. Аттракционы отдельно.','성인 케이블카 왕복 10,000 KZT. 놀이시설은 별도입니다.')}</p>`:''}${day.map?`<div class="actions">${link(maps(day.map),t('Ориентир на карте','지도에서 위치 보기'))}</div>`:''}${day.action?`<button class="action primary no-print" data-stage="${day.action}">${t('Открыть этот день','이날 자세히 보기')} →</button>`:planDetails(day)}</article>`).join('')}</div>${ticketReference()}<details class="budget" ${all?'open':''}><summary>${t('Мой расчёт расходов','예상 지출 정리')}</summary><div><p>${esc(tr(data.journey.expenses))}</p><label class="date-label">${t('Взрослых в компании','성인 인원')}<input type="number" min="1" max="12" step="1" data-people value="${state.people}"></label><div class="expense-grid">${fields.map(([id,scope,label])=>`<label>${esc(label())}<span class="note">${esc(expenseHint(id))}</span><span class="note">${scope==='shared'?t('За всех · KZT','일행 전체 · KZT'):t('На одного · KZT','1인 · KZT')}</span><input type="number" inputmode="decimal" min="0" max="100000000" step="0.01" data-expense="${id}" value="${esc(state.expenses[id]??'')}" placeholder="${t('Ещё неизвестно','아직 미정')}"></label>`).join('')}</div><p class="budget-total" role="status">${esc(total())}</p><div data-budget-summary aria-live="polite">${budgetSummary()}</div><p class="note">${t('Авиабилеты в Казахстан и обратно, покупки и личный запас денег считайте отдельно. Расчёт предназначен для взрослых с равным разделением общих расходов; детские тарифы и разную оплату участников он не учитывает.','카자흐스탄 왕복 항공권과 쇼핑, 개인 여유 자금은 별도입니다. 성인끼리 공동 비용을 균등하게 나누는 계산으로 아동 요금이나 사람마다 다른 부담액은 반영하지 않습니다.')}</p></div></details>`}
return {render,total,dateFor,budgetSummary};
}

function lodging(){return `<aside class="aside" aria-label="${t('Проживание и памятка','숙소와 오프라인 안내')}"><h2>${esc(tr(data.lodging.title))}</h2><p class="small">${esc(tr(data.lodging.body))}</p><p class="small">${esc(tr(data.lodging.tip))}</p><hr class="rule"><h3>${t('Возьмите с собой','오프라인으로 준비하기')}</h3><p class="small">${t('Сохраните выбранную поездку. Тексты и переключатели работают без сети; карты и внешние сайты требуют интернета.','선택한 일정을 저장하면 안내문과 선택 기능을 인터넷 없이 사용할 수 있습니다. 지도와 외부 사이트에는 인터넷이 필요합니다.')}</p><div class="actions"><button class="action primary" data-download>${t('Скачать памятку','안내 저장')}</button><button class="action" data-print>${t('Печать / PDF','인쇄 / PDF')}</button></div><p class="note">${t('Самостоятельная поездка. Жильё, питание и транспорт оплачиваются отдельно.','개별 여행 안내입니다. 숙박과 식사, 교통비는 별도입니다.')}</p></aside>`}
function render(all=false){persist();document.documentElement.lang=state.lang;document.title=tr(data.title)+' | Kazakhstan Guide';const idx=data.stages.findIndex(s=>s.id===state.stage);
root.innerHTML=`<a class="skip" href="#main">${t('К содержимому','본문으로')}</a><div class="review"><div class="wrap"><strong>${t('Самостоятельная поездка','개별 여행 안내')}</strong><span>${t('Пять полных дней. Жильё, билеты и транспорт оплачиваются отдельно.','온전한 다섯 날. 숙박과 입장권, 교통비는 별도입니다.')}</span></div></div><header class="top wrap"><div><a class="brand" href="${esc(siteHome)}#/destinations/almaty">KAZAKHSTAN <b>GUIDE</b></a><a class="back-guide" data-return-guide href="${esc(siteHome)}#/destinations/almaty">← ${t('Все места Алматы','알마티 여행지 보기')}</a></div><button class="language" data-language>${state.lang==='ru'?'한국어':'Русский'}</button></header><div class="hero wrap"><div class="eyebrow">${t('ВАША ПОЕЗДКА · ПЯТЬ ПОЛНЫХ ДНЕЙ','나의 여행 · 온전한 다섯 날')}</div><h1>${esc(tr(data.title))}</h1><p>${esc(tr(data.intro))}</p><div class="tripline"><span>${t('День прилёта','도착일')}</span><i></i><span>${t('Первая ночь','첫 숙박')}</span><i></i><span>${t('Пять полных дней','온전한 다섯 날')}</span></div></div><div class="layout wrap"><main id="main"><nav class="tabs" aria-label="${t('Этап поездки','여행 단계')}">${data.stages.map(s=>`<button data-stage="${s.id}" ${state.stage===s.id?'aria-current="step"':''}>${esc(tr(s.label))}</button>`).join('')}</nav>${all?data.stages.map(s=>section(s.id,true)).join(''):section(state.stage)}<div class="next">${idx>0?`<button class="action" data-stage="${data.stages[idx-1].id}">← ${esc(tr(data.stages[idx-1].label))}</button>`:'<span></span>'}${idx<data.stages.length-1?`<button class="action primary" data-stage="${data.stages[idx+1].id}">${esc(tr(data.stages[idx+1].label))} →</button>`:''}</div></main>${lodging()}</div><footer class="footer"><div class="wrap"><span>${t('Редакция · 22 октября 2026','안내 개정 · 2026년 10월 22일')}</span><span>${t('Ваши выборы сохраняются на устройстве. Ничего не бронируется.','선택 내용은 기기에 저장됩니다. 예약은 이루어지지 않습니다.')}</span></div></footer><div class="toast" role="status" aria-live="polite"></div>`;
}
function toast(message){const el=root.querySelector('.toast');el.textContent=message;setTimeout(()=>{if(el.isConnected)el.textContent=''},4500)}
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
if(b.hasAttribute('data-language')){state.lang=state.lang==='ru'?'ko':'ru';if(location.protocol!=='file:'){const u=new URL(location.href);u.searchParams.set('lang',state.lang);history.replaceState(null,'',u)}try{const main=JSON.parse(localStorage.getItem('kazakhstan-guide-v1')||'{}');localStorage.setItem('kazakhstan-guide-v1',JSON.stringify({...main,lang:state.lang}));}catch{}render();return}
if(b.dataset.stage){state.stage=b.dataset.stage;render();document.getElementById('title-'+state.stage)?.focus({preventScroll:true});return}
if(b.dataset.choice){state[b.dataset.choice]=b.dataset.value;render();root.querySelector(`[data-choice="${b.dataset.choice}"][data-value="${b.dataset.value}"]`)?.focus({preventScroll:true});return}
if(b.hasAttribute('data-download')){document.documentElement.dataset.settings=JSON.stringify(state);document.documentElement.dataset.siteHome=siteHome;const clean=document.documentElement.cloneNode(true);clean.querySelectorAll('script:not(#product-data):not(#product-runtime),style:not(#product-style),link,iframe').forEach(el=>el.remove());const cleanBody=clean.querySelector('body');cleanBody.replaceChildren(clean.querySelector('#product'),clean.querySelector('#product-data'),clean.querySelector('#product-runtime'));const file=new Blob(['<!doctype html>\n'+clean.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='Almaty-guide-'+state.lang+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('Памятка сохранена в HTML. Откройте её в браузере.','HTML 안내를 저장했습니다. 브라우저에서 열어 보세요.'));return}
if(b.hasAttribute('data-print')){render(true);root.querySelectorAll('details').forEach(d=>d.open=true);window.print();render();}
});
root.addEventListener('input',e=>{if(e.target.hasAttribute('data-expense')){const v=e.target.value;if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0||Number(v)>100000000)){e.target.setCustomValidity(t('Введите неотрицательную сумму до 100 000 000','0부터 100,000,000까지 입력하세요'));return}e.target.setCustomValidity('');state.expenses[e.target.dataset.expense]=v;persist();root.querySelector('.budget-total').textContent=tripView.total();root.querySelector('[data-budget-summary]').innerHTML=tripView.budgetSummary();}});
root.addEventListener('change',e=>{if(e.target.hasAttribute('data-first-date')){state.firstDate=e.target.value;const d=tripView.dateFor(1);if(d&&!Number.isFinite(d.getTime()))state.firstDate='';state.monday=!!d&&d.getUTCDay()===1;render();root.querySelector('[data-first-date]')?.focus({preventScroll:true});return}if(e.target.hasAttribute('data-people')){const n=Number(e.target.value);if(Number.isInteger(n)&&n>=1&&n<=12){state.people=n;persist();root.querySelector('.budget-total').textContent=tripView.total();root.querySelector('[data-budget-summary]').innerHTML=tripView.budgetSummary()}else e.target.value=state.people;return}if(e.target.hasAttribute('data-check')){const i=Number(e.target.dataset.check);state.checks=state.checks.filter(n=>n!==i);if(e.target.checked)state.checks.push(i);persist();root.querySelector('.checkcount').textContent=`${state.checks.length} / 4 · ${t('отмечено вами','직접 확인한 항목')}`;}if(e.target.hasAttribute('data-monday')){state.monday=e.target.checked;render();root.querySelector('[data-monday]')?.focus({preventScroll:true})}});
render();
})();
</script><noscript>Для интерактивного образца нужен JavaScript. / 예시를 보려면 JavaScript를 켜 주세요.</noscript></body></html>
