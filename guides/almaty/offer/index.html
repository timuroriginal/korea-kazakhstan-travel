 공원과 그린 바자르, 아르바트 산책으로 여행을 시작하세요. 산에서 보내는 하루와 도시를 내려다보는 풍경, 나만의 여유도 일정에 담았습니다.","buy":"구성과 이용 조건 보기","once":"한 번 구매하는 여행 안내","price":"US$8","online":"결제 후 직접 활성화한 날부터 온라인 40일. 내려받은 파일은 계속 보관할 수 있습니다.","includes":["온전한 다섯 날과 별도의 도착·출국일","내가 고른 숙소에 맞춘 숙박 구성","날짜 선택과 산악 일정 순서 변경","일행 공동 비용과 개인 비용 계산","휴대전화 이용과 저장, 인쇄"],"preview":"첫날 일정 무료로 보기","program":"다섯 날의 흐름","days":[["도착일","숙소에 도착해 쉬고 가까운 곳에서 식사합니다."],["1일차","판필로프 공원과 대성당, 그린 바자르, 아르바트."],["2일차","케이블카가 운행하는 날 메데우와 심불라크."],["3일차","미술관이나 쇼핑, 식사와 여유로운 저녁."],["4일차","관심사와 컨디션에 맞춰 도심에서 쉬어 갑니다."],["5일차","콕토베 전망과 여유로운 여행 마무리."],["출국일","짐 정리와 공항 이동은 다섯 날과 별도로 둡니다."]],"what":"내게 맞게 바꾸는 하나의 일정","features":[["내가 고른 숙소","호텔과 아파트형 숙소, 단기 임대 숙소 중 자유롭게 고르세요. 특정 호텔에 맞추지 않고 매일 출발하고 돌아갈 수 있습니다."],["편안한 속도","도심과 산악 일정의 순서를 바꾸거나 산책을 줄이고 쉬는 시간을 남길 수 있습니다."],["항목별 지출 정리","일행 공동 비용과 개인 비용을 나누어 계산합니다. 미정 금액은 무료로 처리하지 않고 빈 항목으로 표시합니다."],["오프라인으로 준비","내려받은 일정은 인터넷 없이 브라우저에서 사용할 수 있습니다. 지도와 외부 사이트는 연결이 필요합니다."]],"extra":"도시 밖으로 더 가고 싶다면","extraBody":"차른과 콜사이, 카인디 일정도 함께 볼 수 있습니다. 대기와 귀환을 포함한 차량, 필요할 경우 사티 숙박은 별도로 준비해야 합니다. 운송 서비스와 예약은 구매에 포함되지 않습니다.","faq":[["투어나 동행 서비스인가요?","직접 준비하는 여행을 위한 디지털 안내입니다. 입장권과 숙박, 식사, 교통비 등은 별도이며 개인 동행을 제공하지 않습니다."],["러시아어나 영어가 필요한가요?","안내문과 화면은 한국어로 제공됩니다. 러시아어를 안다고 가정하지 않습니다. 현장 직원의 사용 언어는 다르며 한국어 응대나 모든 카드의 결제를 보장하지는 않습니다."],["어떤 내용이 계속 무료인가요?","명소 소개와 여행 준비, 안전 정보, 공개된 개별 일정은 계속 무료입니다. 전체 안내에는 다섯 날의 구성과 달력, 일정 선택, 지출 계산, 저장용 여행 안내가 함께 담깁니다."],["저장한 파일은 계속 볼 수 있나요?","기기에 저장한 파일은 남습니다. 다만 이후 웹사이트의 변경 사항이 자동 반영되지는 않습니다."],["매달 결제하나요?","제안한 방식은 구독이나 자동 결제 없이 한 번 구매하는 여행 안내입니다."],["장거리 여행을 하지 않아도 되나요?","네. 기본 일정은 도심과 산에서 보내는 하루로 구성됩니다. 차른과 호수는 별도 선택 사항입니다. 외곽으로 간다면 귀환을 포함한 교통편을 미리 준비해야 합니다."]],"checkout":"구매에 포함되는 내용","order":"알마티 디지털 여행 안내","unit":"알마티를 직접 여행하기 위한 디지털 안내입니다. 입장권과 숙박, 식사, 교통비는 별도입니다.","terms":"결제 연결과 구매·환불 조건 안내를 마친 뒤 판매를 시작합니다. 현재는 결제할 수 없습니다.","pay":"판매 준비 중","payNote":"출시 전에는 무료 예시에서 방문 순서와 이동, 숙소로 돌아가는 방법을 살펴보세요.","accessTitle":"여행 중에도 곁에 두는 안내","accessNote":"구매 후 이용 방식을 안내합니다. 이메일 로그인은 아직 준비 중입니다.","accessBody":"구매가 확인되면 ‘나의 여행’에서 안내를 이용할 수 있습니다. 온라인 40일 이용은 준비가 되었을 때 직접 시작하세요.","restore":"다른 기기에서도 같은 이메일과 새 인증 코드로 로그인할 수 있습니다. 기존 종료일은 그대로 유지됩니다.","footer":"알마티, 나에게 맞는 여행. 구독 없이 한 번 구매하는 US$8 디지털 안내입니다. 판매는 준비 중입니다.","priceNote":"안내 가격은 US$8입니다. 결제 통화와 최종 금액은 결제 전에 표시합니다.","fit":"직접 준비하는 여행에","fitBody":"항공편과 숙소는 직접 고르고, 여행 일정은 한곳에서 정리하고 싶은 분을 위한 안내입니다. 한국어와 러시아어로 이용할 수 있으며 호텔이나 아파트형 숙소 등 원하는 곳에서 여행을 시작할 수 있습니다.","comparisonTitle":"여행 안내에 담긴 것","comparisonHeads":["무료 웹사이트","한 번의 여행을 위한 안내"],"comparison":[["명소 소개와 개별 일정을 읽으며 알마티에서 가 보고 싶은 곳을 고를 수 있습니다.","온전한 다섯 날을 하나의 흐름으로 구성했습니다. 도착일과 숙박, 출국일은 따로 살펴봅니다."],["여행 준비와 교통 등 실용 정보는 계속 무료로 볼 수 있습니다.","날짜와 도심·외곽 일정 선택, 하루 순서 변경, 지출 계산을 한곳에서 이용합니다."],["페이지별로 내용을 읽을 수 있습니다.","선택한 일정과 함께 휴대전화에 저장하거나 인쇄할 수 있습니다."]],"sampleTitle":"첫날 일정부터 살펴보세요","sampleIntro":"공원과 그린 바자르, 아르바트를 걷는 하루입니다. 이동 경로와 지도, 월요일 대안까지 예시에서 볼 수 있습니다.","sampleSteps":[["공원에서 시작","판필로프 공원을 걷고 승천 대성당의 외관을 둘러보세요. 한 시간 정도 여유를 두면 좋습니다."],["시장과 아르바트","그린 바자르를 구경한 뒤 지베크 졸리 거리를 따라 아르바트로 갑니다. 월요일이라면 시장은 건너뜁니다."],["식사 후에는 자유롭게","아르바트 주변의 카페나 식당에서 식사하세요. 조금 더 걷거나 머무는 숙소로 돌아가 쉬어도 좋습니다."]],"sampleMore":"산책 일정 간단히 보기","sampleFoot":"무료 예시에는 첫 도심 일정 전체가 담겨 있습니다. 전체 안내에는 나머지 일정과 여행 계획 도구가 더해집니다.","previewNote":"도심에서 보내는 하루 전체를 볼 수 있습니다. 가입이나 결제, 이메일 입력이 필요하지 않습니다.","nextTitle":"구매 후 이용 순서","nextSteps":["이메일로 받은 일회용 코드로 본인 주소를 확인합니다.","판매가 시작되면 결제 서비스의 페이지에서 구매합니다.","이용할 준비가 되었을 때 온라인 40일 이용을 별도로 활성화합니다.","출발 전에 파일을 저장하세요. 온라인 이용 기간이 끝나도 저장한 파일은 남습니다."],"contentsTitle":"포함된 내용","contents":["출국 전 준비, 아침·낮·밤 도착에 따른 안내, 휴식과 첫 저녁.","도심과 산, 미술관 또는 쇼핑, 여유로운 하루와 콕토베로 이어지는 온전한 다섯 날.","차량을 직접 준비하는 분을 위한 차른·콜사이·카인디 추가 일정.","여행 달력과 숙박 구성, 도심·산악 일정 순서 변경, 직접 입력하는 지출 계산.","날짜별 출발과 귀환 안내, Google 지도 링크, 저장용 파일과 인쇄."],"accessItems":[["비밀번호 없는 로그인","이메일로 받은 일회용 코드로 로그인합니다. 별도 비밀번호를 만들 필요가 없습니다."],["준비가 되었을 때 활성화","별도 확인을 거쳐 이용 기간이 시작됩니다. 구매하거나 이메일을 읽는 것만으로는 시작되지 않습니다."],["화면에서 확인하는 이용 기간","나의 여행에서 시작일과 종료일을 확인합니다. 다시 로그인해도 40일이 새로 시작되지 않습니다."],["계속 보관하는 파일","저장한 HTML은 인터넷 없이 열 수 있습니다. 지도에는 인터넷이 필요하며, 웹사이트 수정 내용이 저장 파일에 자동 반영되지는 않습니다."]],"returnLabel":"알마티 여행지 보기","sampleLink":"무료 예시 열기","notIncluded":"별도로 준비하는 비용","notIncludedBody":"항공권과 숙박, 식사, 택시, 케이블카와 입장권, 장거리 차량은 별도입니다. 안내를 구매해도 이러한 서비스가 예약되지는 않습니다.","activationLabel":"직접 시작하는 온라인 40일","activationBody":"구매 후 별도 버튼으로 이용 기간을 시작합니다. 구독이나 자동 결제는 없습니다."}};
let lang=new URLSearchParams(location.search).get('lang')==='ko'?'ko':'ru',step=0;
function render(){
 const c=copy[lang];document.documentElement.lang=lang;document.title=c.title+' | Kazakhstan Guide';
 document.querySelector('.steps').setAttribute('aria-label',lang==='ru'?'О путеводителе и доступе':'여행 안내와 이용 방법');
 document.querySelector('[data-lang]').textContent=lang==='ru'?'한국어':'Русский';
 document.querySelector('#return-guide').textContent='← '+c.returnLabel;
 document.querySelector('#review').textContent=c.review;
 document.querySelector('.steps').innerHTML=c.steps.map((v,i)=>`<button data-step="${i}" ${step===i?'aria-current="step"':''}>${v}</button>`).join('');
 document.querySelector('#footer').innerHTML=`<p>${c.footer}</p>`;
 const sample=`<a class="cta" data-sample-link href="../sample/?lang=${lang}">${c.sampleLink} →</a>`;
 const contentList=`<section class="card" data-contents><h2>${c.contentsTitle}</h2><ul>${c.contents.map(v=>`<li>${v}</li>`).join('')}</ul></section>`;
 const terms=`<section class="note" data-activation><h2>${c.activationLabel}</h2><p>${c.activationBody}</p><p>${c.online}</p></section>`;
 const excluded=`<section class="card"><h2>${c.notIncluded}</h2><p>${c.notIncludedBody}</p></section>`;
 document.querySelector('#main').innerHTML=step===0?`
 <div class="hero"><div class="eyebrow">${c.kicker}</div><h1>${c.title}</h1><p class="lead">${c.intro}</p></div>
 <div class="grid"><div><section class="note"><h2>${c.fit}</h2><p>${c.fitBody}</p></section>
 <section class="card"><h2>${c.program}</h2><ol class="days">${c.days.map(([a,b])=>`<li><strong>${a}</strong><span>${b}</span></li>`).join('')}</ol></section>
 <section class="card sample"><h2>${c.sampleTitle}</h2><p>${c.sampleIntro}</p>${sample}<p class="small">${c.sampleFoot}</p></section>
 <section><h2>${c.what}</h2><div class="facts">${c.features.map(([a,b])=>`<article><h3>${a}</h3><p>${b}</p></article>`).join('')}</div></section>
 <section class="comparison"><h2>${c.comparisonTitle}</h2><div class="compare-grid">${c.comparisonHeads.map((title,i)=>`<article class="card"><h3>${title}</h3><ul>${c.comparison.map(row=>`<li>${row[i]}</li>`).join('')}</ul></article>`).join('')}</div></section>
 <section class="card"><h2>${c.extra}</h2><p>${c.extraBody}</p></section>${excluded}
 <section class="card"><h2>${c.nextTitle}</h2><ol>${c.nextSteps.map(v=>`<li>${v}</li>`).join('')}</ol></section>
 <section>${c.faq.map(([a,b])=>`<details><summary>${a}</summary><p>${b}</p></details>`).join('')}</section></div>
 <aside class="purchase"><div class="eyebrow">${c.once}</div><p class="price">${c.price}</p><p class="small" data-price-note>${c.priceNote}</p><p>${c.online}</p><ul>${c.includes.map(a=>`<li>${a}</li>`).join('')}</ul>
 <button class="cta" data-step="1">${c.buy}</button><a class="secondary" data-sample-link href="../sample/?lang=${lang}">${c.preview} →</a><p class="small">${c.previewNote}</p></aside></div>`:step===1?`
 <section class="form"><h1>${c.checkout}</h1><p class="lead">${c.unit}</p><div class="receipt"><span>${c.once}</span><strong>${c.price}</strong></div><p class="small" data-price-note>${c.priceNote}</p>${contentList}${terms}${excluded}
 <div class="message">${c.terms}</div><p>${c.payNote}</p><button class="cta" data-payment-unavailable disabled>${c.pay}</button><p>${sample}</p><button class="outline" data-step="2">${c.steps[2]} →</button></section>`:`
 <section class="form"><div class="eyebrow">${c.steps[2]}</div><h1>${c.accessTitle}</h1><p class="lead">${c.accessBody}</p><div class="message">${c.accessNote}</div>
 ${c.accessItems.map(([title,body])=>`<article class="card"><h2>${title}</h2><p>${body}</p></article>`).join('')}
 <p>${c.restore}</p>${sample}<p><button class="outline" data-step="1">← ${c.steps[1]}</button></p></section>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-lang')){lang=lang==='ru'?'ko':'ru';const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);render()}
 else if(b.hasAttribute('data-step')){step=Number(b.dataset.step);render();document.querySelector('#main').focus();document.querySelector('#main').scrollIntoView({block:'start'})}
});render();
</script></body></html>
